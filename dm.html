<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DM - 上藤沢中学校 部活動黒板</title>
<style>
:root{--primary:#1E4D2B;--primary-dark:#153820;--primary-light:#2D6B40;--accent-pink:#f5a0b8;--accent-blue:#a0c4e8;--accent-yellow:#f5e6a0;--accent-green:#a8d8a0;--bg:#f7f5f0;--card:#fff;--text:#2c2c2c;--sub:#8a8682;--border:#e0dcd4;--radius:12px;--shadow:0 2px 12px rgba(30,77,43,0.06);--danger:#d32f2f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column}
.header{background:var(--primary);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.header-title{font-size:16px;font-weight:700;color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.header-link{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);padding:4px 12px;font-size:12px;cursor:pointer;color:rgba(255,255,255,.85);border-radius:8px;text-decoration:none;transition:all .2s;font-family:inherit}
.header-link:hover{background:rgba(255,255,255,.25);color:#fff}
.dm-body{flex:1;display:flex;max-width:1000px;width:100%;overflow:hidden}
.dm-sidebar{width:30%;min-width:200px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column}
.dm-sidebar h3{font-size:11px;font-weight:700;color:var(--sub);padding:12px 12px 8px;text-transform:uppercase;letter-spacing:.5px}
.dm-search{padding:4px 12px 8px}
.dm-search input{width:100%;padding:6px 8px;border:2px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:#faf8f5}
.dm-search input:focus{outline:none;border-color:var(--primary)}
.dm-conv-list{flex:1;overflow-y:auto}
.dm-conv{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:8px}
.dm-conv:hover{background:var(--bg)}
.dm-conv.active{background:#e8f0e8;border-left:3px solid var(--primary)}
.dm-conv .dc-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.dm-conv .dc-info{flex:1;min-width:0}
.dm-conv .dc-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.dm-conv .dc-last{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-conv .dc-time{font-size:10px;color:var(--sub);white-space:nowrap}
.dm-conv .dc-role{font-size:9px;color:var(--sub);background:var(--bg);padding:1px 5px;border-radius:3px}
.dm-conv .dc-unread{background:var(--primary);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dm-main{flex:1;display:flex;flex-direction:column;min-width:0}
.dm-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;padding:20px;text-align:center}
.dm-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.dm-header .dh-role{font-size:11px;font-weight:400;color:var(--sub)}
.dm-header .dh-members{font-size:11px;font-weight:400;color:var(--sub);margin-left:auto}
.dm-header .dh-add-btn{font-size:10px;padding:2px 8px;background:var(--primary);color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:inherit}
.dm-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.dm-msg{background:var(--card);padding:8px 12px;border-radius:10px;max-width:80%;animation:fadeIn .15s}
.dm-msg.sent{align-self:flex-end;background:var(--accent-blue);border-bottom-right-radius:3px}
.dm-msg.received{align-self:flex-start;border-bottom-left-radius:3px}
.dm-msg .dm-author{font-size:10px;font-weight:600;color:var(--primary);margin-bottom:2px}
.dm-msg .dm-text{font-size:13px;line-height:1.5;word-break:break-word}
.dm-msg .dm-time{font-size:9px;color:var(--sub);margin-top:2px;text-align:right}
.dm-input{display:flex;gap:8px;padding:10px 16px;flex-shrink:0;border-top:1px solid var(--border)}
.dm-input input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);transition:all .2s}
.dm-input input:focus{outline:none;border-color:var(--primary)}
.dm-input button{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.dm-input button:hover{background:var(--primary-dark)}
.dm-new-btn{display:block;margin:8px 12px;padding:8px;text-align:center;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.dm-new-btn:hover{background:var(--primary-dark)}
.dm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center}
.dm-overlay.show{display:flex}
.dm-new-modal{background:var(--card);border-radius:14px;padding:20px;max-width:380px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.dm-new-modal h3{font-size:15px;font-weight:700;margin-bottom:12px}
.dm-new-modal label{font-size:12px;font-weight:700;color:var(--sub);display:block;margin:8px 0 4px}
.dm-new-modal input[type=text]{width:100%;padding:8px 10px;border:2px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
.dm-new-modal input[type=text]:focus{outline:none;border-color:var(--primary)}
.dm-user-list{max-height:200px;overflow-y:auto;margin:4px 0 8px;border:1px solid var(--border);border-radius:6px}
.dm-user-item{padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;transition:background .15s}
.dm-user-item:hover{background:var(--bg)}
.dm-user-item.selected{background:#e8f0e8}
.dm-user-item .dui-role{font-size:10px;color:var(--sub);background:var(--bg);padding:1px 5px;border-radius:3px}
.dm-new-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.dm-new-actions button{padding:6px 16px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.dm-new-actions .btn-primary{background:var(--primary);color:#fff}
.dm-new-actions .btn-primary:hover{background:var(--primary-dark)}
.dm-new-actions .btn-cancel{background:var(--bg);color:var(--text);border:1px solid var(--border)}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.dm-sidebar{width:40%;min-width:140px}.dm-main{min-width:0}}
</style>
</head>
<body>
<header class="header">
  <div class="header-title">💬 DM</div>
  <div class="header-right">
    <a href="01index.html" class="header-link">黒板に戻る</a>
  </div>
</header>
<div class="dm-body">
  <div class="dm-sidebar">
    <h3>📨 メッセージ</h3>
    <div class="dm-search"><input type="text" id="dmSearch" placeholder="検索..."></div>
    <button class="dm-new-btn" id="dmNewBtn">＋ 新しいメッセージ</button>
    <button class="dm-new-btn" id="dmNewGroupBtn" style="background:var(--primary-dark);margin-top:2px">👥 グループを作成</button>
    <div class="dm-conv-list" id="dmConvList">読み込み中...</div>
  </div>
  <div class="dm-main">
    <div class="dm-placeholder" id="dmPlaceholder">会話を選択してください</div>
    <div id="dmChatArea" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="dm-header" id="dmChatHeader"></div>
      <div class="dm-msgs" id="dmMsgList"></div>
      <div class="dm-input">
        <input type="text" id="dmMsgInput" placeholder="メッセージを入力..." maxlength="1000" autofocus>
        <button id="dmSendBtn">送信</button>
      </div>
    </div>
  </div>
</div>
<div class="dm-overlay" id="dmOverlay">
  <div class="dm-new-modal" id="dmNewModalContent">
    <h3 id="dmNewTitle">宛先を選択</h3>
    <input type="text" id="dmUserSearch" placeholder="名前またはIDで検索..." style="width:100%;padding:8px 10px;border:2px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:8px">
    <div class="dm-user-list" id="dmUserList"></div>
    <div class="dm-new-actions">
      <button class="btn-cancel" id="dmNewCancel">キャンセル</button>
    </div>
  </div>
</div>
<script>
const API_BASE=''
async function a(p,o={}){const t=sessionStorage.getItem('token'),h={'Content-Type':'application/json',...o.headers};if(t)h['Authorization']='Bearer '+t;const r=await fetch(API_BASE+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw new Error(d.error||'エラー');return d}
const $=id=>document.getElementById(id.replace('#',''));const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const cu=sessionStorage.getItem('username'),role=sessionStorage.getItem('role')||'';
if(!cu||!role)window.location.href='02login.html';
const isStaff=['admin','teacher'].some(r=>role.includes(r));

let convs=[],activeConv=null,activeType=null,lastTimes={},loadedOnce={};

async function loadConvs(){
  try{
    convs=await a('/api/dm/conversations');
    const el=$('dmConvList');
    const q=$('dmSearch').value.toLowerCase();
    let filtered=q?convs.filter(c=>{
      const name=c.type==='group'?c.name:c.display_name;
      return name.toLowerCase().includes(q)||(c.username||'').toLowerCase().includes(q);
    }):convs;
    el.innerHTML=filtered.map(c=>{
      const id=c.type==='group'?c.id:c.username;
      const isActive=activeType===c.type&&activeConv===id;
      const icon=c.type==='group'?'👥':'💬';
      const name=c.type==='group'?c.name:c.display_name;
      const sub=c.type==='group'?(c.members.length+'人'):roleNames(c.role);
      const last=c.last_message||'';
      return '<div class="dm-conv'+(isActive?' active':'')+'" data-type="'+c.type+'" data-id="'+esc(id)+'"><span class="dc-icon">'+icon+'</span><div class="dc-info"><div class="dc-name">'+esc(name)+' <span class="dc-role">'+esc(sub)+'</span></div><div class="dc-last">'+esc(last)+'</div></div><div style="text-align:right;flex-shrink:0"><div class="dc-time">'+timeAgo(c.last_time)+'</div>'+(c.unread>0?'<div class="dc-unread">'+c.unread+'</div>':'')+'</div></div>';
    }).join('');
    el.querySelectorAll('.dm-conv').forEach(el2=>{el2.addEventListener('click',()=>openConv(el2.dataset.type,el2.dataset.id))});
  }catch(e){}
}
function roleNames(r){
  const m={'admin':'管理者','teacher':'先生','president':'部長','vice-president':'副部長','chairperson':'委員長','student':'生徒'};
  return (r||'').split(',').map(s=>m[s.trim()]||s.trim()).filter(Boolean).join('·');
}
function timeAgo(t){
  if(!t)return'';const d=new Date(t),n=new Date();
  if(d.toDateString()===n.toDateString())return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const y=(n-d)/86400000;return y<2?'昨日':y<7?Math.floor(y)+'日前':(d.getMonth()+1)+'/'+d.getDate();
}

async function openConv(type,id){
  activeType=type;activeConv=id;
  $('#dmPlaceholder').style.display='none';
  $('#dmChatArea').style.display='flex';
  loadedOnce[type+'_'+id]=false;
  if(type==='dm'){
    await a('/api/dm/read/'+encodeURIComponent(id),{method:'POST'});
    const c=convs.find(x=>x.type==='dm'&&x.username===id);
    $('#dmChatHeader').innerHTML='💬 '+esc(c?c.display_name:id)+' <span class="dh-role">'+esc(c?roleNames(c.role):'')+'</span>';
  }else{
    const c=convs.find(x=>x.type==='group'&&x.id===id);
    $('#dmChatHeader').innerHTML='👥 '+esc(c?c.name:'グループ')+' <span class="dh-role">'+(c?c.members.length+'人':'')+'</span>';
  }
  await loadMsgs(type,id);
  loadConvs();
}

async function loadMsgs(type,id){
  const list=$('#dmMsgList');
  if(!loadedOnce[type+'_'+id]){list.innerHTML='';loadedOnce[type+'_'+id]=true}
  try{
    let msgs;
    if(type==='dm')msgs=await a('/api/dm/messages/'+encodeURIComponent(id));
    else msgs=await a('/api/dm/groups/'+id+'/messages');
    const since=lastTimes[type+'_'+id]||0;
    const newMsgs=msgs.filter(m=>new Date(m.created_at).getTime()>=since);
    if(newMsgs.length&&loadedOnce[type+'_'+id]){
      newMsgs.forEach(m=>renderMsg(m,list,type));
    }else if(!loadedOnce[type+'_'+id]){
      msgs.forEach(m=>renderMsg(m,list,type));
      loadedOnce[type+'_'+id]=true;
    }
    if(msgs.length){
      lastTimes[type+'_'+id]=new Date(msgs[msgs.length-1].created_at).getTime()+1;
    }
    scrollBottom();
  }catch(e){}
}
function renderMsg(m,l,type){
  const sent=m.from===cu;
  const d=document.createElement('div');d.className='dm-msg '+(sent?'sent':'received');
  const time=new Date(m.created_at);
  const ts=String(time.getHours()).padStart(2,'0')+':'+String(time.getMinutes()).padStart(2,'0');
  const author=type==='group'&&!sent?'<div class="dm-author">'+esc(m.from)+'</div>':'';
  d.innerHTML=author+'<div class="dm-text">'+esc(m.message)+'</div><div class="dm-time">'+ts+'</div>';
  l.appendChild(d);
}
function scrollBottom(){requestAnimationFrame(()=>{$('#dmMsgList').scrollTop=$('#dmMsgList').scrollHeight})}

async function sendMsg(){
  if(!activeConv)return;
  const inp=$('#dmMsgInput'),txt=inp.value.trim();
  if(!txt)return;
  inp.disabled=true;
  try{
    let r;
    if(activeType==='dm')r=await a('/api/dm/send',{method:'POST',body:JSON.stringify({to:activeConv,message:txt})});
    else r=await a('/api/dm/groups/'+activeConv+'/send',{method:'POST',body:JSON.stringify({message:txt})});
    inp.value='';
    const cat=activeType==='dm'?'dm':'group-dm';
    const lbl=activeType==='dm'?'DM':'グループDM';
    fetch('/api/push/notify',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionStorage.getItem('token')},body:JSON.stringify({category:cat,title:lbl,body:txt.slice(0,80),url:'/dm.html',excludeUser:sessionStorage.getItem('username')})}).catch(()=>{});
    const list=$('#dmMsgList');
    renderMsg(r,list,activeType);
    scrollBottom();
    lastTimes[activeType+'_'+activeConv]=new Date(r.created_at).getTime()+1;
    loadConvs();
  }catch(e){alert(e.message)}
  inp.disabled=false;inp.focus();
}

$('#dmSendBtn').addEventListener('click',sendMsg);
$('#dmMsgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
$('#dmSearch').addEventListener('input',()=>loadConvs());

// Poll for new messages
setInterval(()=>{
  if(activeConv&&activeType)loadMsgs(activeType,activeConv);
},4000);
setInterval(loadConvs,10000);

// New DM dialog
let allUsers=[];
async function loadUsersForNew(){
  try{allUsers=await a('/api/users')}catch(e){}
}
function renderUserList(q,multi){
  q=(q||'').toLowerCase();
  const el=$('#dmUserList');
  let list=allUsers.filter(u=>u.username!==cu);
  if(q)list=list.filter(u=>u.display_name.toLowerCase().includes(q)||u.username.toLowerCase().includes(q));
  if(multi){
    const sel=new Set(Array.from(el.querySelectorAll('.selected')).map(e=>e.dataset.user));
    el.innerHTML=list.map(u=>'<div class="dm-user-item'+(sel.has(u.username)?' selected':'')+'" data-user="'+esc(u.username)+'"><span>'+esc(u.display_name||u.username)+'</span><span class="dui-role">'+esc(roleNames(u.role))+'</span></div>').join('');
    el.querySelectorAll('.dm-user-item').forEach(e=>{e.addEventListener('click',()=>{e.classList.toggle('selected')})});
  }else{
    el.innerHTML=list.map(u=>'<div class="dm-user-item" data-user="'+esc(u.username)+'"><span>'+esc(u.display_name||u.username)+'</span><span class="dui-role">'+esc(roleNames(u.role))+'</span></div>').join('');
    el.querySelectorAll('.dm-user-item').forEach(e=>{e.addEventListener('click',()=>{
      $('#dmOverlay').classList.remove('show');
      openConv('dm',e.dataset.user);
    })});
  }
}

// New DM (1-on-1) - teachers/admins only
if(isStaff){
$('#dmNewBtn').addEventListener('click',()=>{
  $('#dmNewTitle').textContent='宛先を選択';
  $('#dmNewModalContent').innerHTML='<h3 id="dmNewTitle">宛先を選択</h3><input type="text" id="dmUserSearch" placeholder="名前またはIDで検索..." style="width:100%;padding:8px 10px;border:2px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:8px"><div class="dm-user-list" id="dmUserList"></div><div class="dm-new-actions"><button class="btn-cancel" id="dmNewCancel">キャンセル</button></div>';
  $('#dmOverlay').classList.add('show');
  $('#dmUserSearch').value='';
  renderUserList('',false);
  $('#dmUserSearch').addEventListener('input',function(){renderUserList(this.value,false)});
  $('#dmNewCancel').addEventListener('click',()=>$('#dmOverlay').classList.remove('show'));
  $('#dmOverlay').addEventListener('click',e=>{if(e.target===$('#dmOverlay'))$('#dmOverlay').classList.remove('show')});
});
}
// New Group DM - teachers/admins only
if(isStaff){
$('#dmNewGroupBtn').addEventListener('click',()=>{
  $('#dmNewModalContent').innerHTML='<h3>👥 グループを作成</h3><label>グループ名</label><input type="text" id="dmGroupName" placeholder="グループ名"><label>メンバーを選択</label><input type="text" id="dmUserSearch" placeholder="検索..." style="width:100%;padding:8px 10px;border:2px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:4px"><div class="dm-user-list" id="dmUserList"></div><div class="dm-new-actions"><button class="btn-cancel" id="dmNewCancel">キャンセル</button><button class="btn-primary" id="dmGroupCreateBtn">作成</button></div>';
  $('#dmOverlay').classList.add('show');
  $('#dmUserSearch').value='';
  renderUserList('',true);
  $('#dmUserSearch').addEventListener('input',function(){renderUserList(this.value,true)});
  $('#dmNewCancel').addEventListener('click',()=>$('#dmOverlay').classList.remove('show'));
  $('#dmOverlay').addEventListener('click',e=>{if(e.target===$('#dmOverlay'))$('#dmOverlay').classList.remove('show')});
  $('#dmGroupCreateBtn').addEventListener('click',async()=>{
    const name=$('#dmGroupName').value.trim();
    const sel=Array.from($('#dmUserList').querySelectorAll('.selected')).map(e=>e.dataset.user);
    if(!name){alert('グループ名を入力してください');return}
    if(sel.length<1){alert('メンバーを1人以上選択してください');return}
    try{
      await a('/api/dm/groups',{method:'POST',body:JSON.stringify({name,members:sel})});
      $('#dmOverlay').classList.remove('show');
      loadConvs();
    }catch(e){alert(e.message)}
  });
});
}
// Also hide new message buttons for students
if(!isStaff){$('#dmNewBtn').style.display='none';$('#dmNewGroupBtn').style.display='none'}

loadConvs();
loadUsersForNew();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
