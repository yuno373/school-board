<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ログイン - 上藤沢中学校 部活動黒板</title>
<style>
:root{--primary:#1E4D2B;--primary-dark:#153820;--primary-light:#2D6B40;--accent-pink:#f5a0b8;--accent-blue:#a0c4e8;--accent-yellow:#f5e6a0;--accent-green:#a8d8a0;--bg:#f7f5f0;--card:#fff;--text:#2c2c2c;--sub:#8a8682;--border:#e0dcd4;--danger:#c96565;--radius:12px;--shadow:0 4px 20px rgba(30,77,43,0.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-container{width:100%;max-width:420px;padding:20px}
.login-card{background:var(--card);border-radius:var(--radius);padding:40px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--primary)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{width:56px;height:56px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px;color:#fff}
.logo h1{font-size:18px;font-weight:700;color:var(--text)}
.logo p{font-size:12px;color:var(--sub);margin-top:4px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
.form-group input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;background:#faf8f5;transition:all .2s}
.form-group input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(30,77,43,0.08)}
.login-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.login-btn:hover{background:var(--primary-dark);box-shadow:0 4px 16px rgba(30,77,43,0.25)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.error{background:#fce8e8;color:var(--danger);padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.error.show{display:block}
.lock-info{background:#faf0e0;color:#8a6a20;padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:16px;display:none;line-height:1.5}
.lock-info.show{display:block}
.forgot-link{display:block;text-align:center;margin-top:12px;font-size:12px;color:var(--sub);cursor:pointer;text-decoration:none;background:0 0;border:none;font-family:inherit;width:100%}
.forgot-link:hover{color:var(--primary)}
.footer{text-align:center;margin-top:24px}
.footer a{color:var(--sub);font-size:12px;text-decoration:none}
.footer a:hover{color:var(--primary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.login-card{animation:fadeIn .4s ease}
.pwreset-section{display:none;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.pwreset-section.show{display:block}
.pwreset-section h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text)}
.pwreset-section select{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#faf8f5;margin-bottom:12px}
.pwreset-section select:focus{outline:none;border-color:var(--primary)}
.pwreset-section .success{font-size:13px;color:var(--primary);padding:12px;background:#e8f0e8;border-radius:8px;margin-bottom:8px;display:none}
.pwreset-section .success.show{display:block}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card" id="loginCard">
    <div class="logo">
      <div class="logo-icon">📋</div>
      <h1>部活動黒板</h1>
      <p>上藤沢中学校</p>
    </div>
    <div class="error" id="errorMsg"></div>
    <div class="lock-info" id="lockInfo"></div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">ログインID（表示名でも可）</label>
        <input type="text" id="username" placeholder="ログインIDまたは表示名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" placeholder="パスワードを入力" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">ログイン</button>
    </form>
    <button class="forgot-link" id="forgotBtn">🔑 パスワードを忘れた</button>
    <div class="pwreset-section" id="pwresetSection">
      <h3>🔑 パスワード再設定</h3>
      <p id="pwresetStep" style="font-size:12px;color:var(--sub);margin-bottom:12px">あなたの名前またはログインIDを入力し、再設定を依頼する先生を選んでください。</p>
      <div class="form-group">
        <label>あなたの名前（ログインID）</label>
        <input type="text" id="pwUsername" placeholder="ログインIDまたは表示名">
      </div>
      <div class="form-group">
        <label>依頼する先生</label>
        <select id="pwTeacher"><option value="">先生を読み込み中...</option></select>
      </div>
      <button class="login-btn" id="pwResetBtn">依頼する</button>
      <div class="success" id="pwSuccess">依頼しました。先生がパスワードを再設定すると、ここで確認できます。<br><button class="forgot-link" id="pwCheckBtn" style="margin-top:8px">✅ 再設定されたか確認する</button><div id="pwNewPwd" style="margin-top:8px;font-weight:700;display:none"></div></div>
      <button class="forgot-link" id="pwBackBtn" style="margin-top:8px">← ログインに戻る</button>
    </div>
    <div class="footer"><a href="#">上藤沢中学校 部活動黒板</a></div>
  </div>
</div>
<script>
const API_BASE=''
const $=id=>document.getElementById(id);
let pwRequestId=null;

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const btn=$('loginBtn');btn.disabled=true;btn.textContent='ログイン中...';
  $('errorMsg').className='error';$('lockInfo').className='lock-info';
  try{
    const u=$('username').value.trim(),p=$('password').value;
    if(!u||!p){$('errorMsg').textContent='入力してください';$('errorMsg').className='error show';btn.disabled=false;btn.textContent='ログイン';return}
    const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))).map(x=>x.toString(16).padStart(2,'0')).join('');
    const r=await fetch(API_BASE+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:h})});
    const d=await r.json();
    if(!r.ok){
      if(d.locked){$('lockInfo').textContent='🔒 ログインがロックされました。あと'+d.remaining+'分お待ちください。';$('lockInfo').className='lock-info show'}
      else{$('errorMsg').textContent=d.error||'ログインに失敗しました';$('errorMsg').className='error show'}
      btn.disabled=false;btn.textContent='ログイン';return
    }
    sessionStorage.setItem('token',d.token);sessionStorage.setItem('username',d.username);sessionStorage.setItem('role',d.role);
    sessionStorage.setItem('display_name',d.display_name||d.username);
    const isTeacher=(d.role||'').split(',').some(r=>['teacher','admin'].includes(r.trim()));
    if(isTeacher&&!d.teacher_setup_done){window.location.href='teacher-setup.html'}else{window.location.href='01index.html'}
  }catch(e){$('errorMsg').textContent='サーバーに接続できません';$('errorMsg').className='error show';btn.disabled=false;btn.textContent='ログイン'}
});

// Password reset
$('forgotBtn').addEventListener('click',()=>{
  $('loginForm').style.display='none';
  $('forgotBtn').style.display='none';
  $('pwresetSection').classList.add('show');
  loadTeachers();
});
$('pwBackBtn').addEventListener('click',()=>{
  $('loginForm').style.display='';
  $('forgotBtn').style.display='';
  $('pwresetSection').classList.remove('show');
});

async function loadTeachers(){
  try{
    const r=await fetch(API_BASE+'/api/users/public');
    const users=await r.json();
    const teachers=users.filter(u=>(u.role||'').split(',').some(r=>['teacher','admin'].includes(r.trim())));
    const el=$('pwTeacher');
    el.innerHTML='<option value="">先生を選択</option>'+teachers.map(t=>'<option value="'+esc(t.username)+'">'+esc(t.display_name||t.username)+'</option>').join('');
  }catch(e){$('pwTeacher').innerHTML='<option value="">読み込みエラー</option>'}
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

$('pwResetBtn').addEventListener('click',async()=>{
  const username=$('pwUsername').value.trim();
  const teacher=$('pwTeacher').value;
  if(!username){alert('あなたの名前を入力してください');return}
  if(!teacher){alert('先生を選択してください');return}
  $('pwResetBtn').disabled=true;$('pwResetBtn').textContent='送信中...';
  try{
    const r=await fetch(API_BASE+'/api/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,teacher})});
    const d=await r.json();
    if(!r.ok){alert(d.error||'エラー');$('pwResetBtn').disabled=false;$('pwResetBtn').textContent='依頼する';return}
    pwRequestId=d.id;
    $('pwResetBtn').style.display='none';
    $('pwSuccess').classList.add('show');
    $('pwStep').textContent='依頼しました。先生が再設定すると下のボタンで確認できます。';
  }catch(e){alert('エラーが発生しました');$('pwResetBtn').disabled=false;$('pwResetBtn').textContent='依頼する'}
});

$('pwCheckBtn').addEventListener('click',async()=>{
  if(!pwRequestId){alert('先に依頼してください');return}
  try{
    const r=await fetch(API_BASE+'/api/password-reset/check/'+pwRequestId);
    const d=await r.json();
    if(d.status==='done'){
      $('pwNewPwd').style.display='block';
      $('pwNewPwd').innerHTML='新しいパスワード: <strong>'+esc(d.new_password)+'</strong><br><span style="font-size:11px;color:var(--sub)">このパスワードでログインしてください</span>';
      $('pwCheckBtn').textContent='✅ 確認済み';
    }else{
      alert('まだ再設定されていません。先生が処理するまでお待ちください。');
    }
  }catch(e){alert('エラー')}
});
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
