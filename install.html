<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>インストール方法 - 上藤沢中学校 黒板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:#f7f5f0;color:#2c2c2c;text-align:center;padding:40px 20px}
.card{background:#fff;border-radius:16px;padding:30px 20px;box-shadow:0 2px 12px rgba(30,77,43,0.06);max-width:480px;margin:0 auto}
.logo{font-size:32px;margin-bottom:8px}
h1{font-size:20px;font-weight:700;color:#1E4D2B;margin-bottom:6px}
.desc{font-size:14px;color:#8a8682;margin-bottom:24px;line-height:1.6}
.qr{margin:0 auto 24px;background:#fff;padding:16px;border-radius:12px;display:inline-block;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.qr img{width:200px;height:200px;display:block}
.steps{text-align:left;margin-bottom:24px}
.step{display:flex;gap:12px;align-items:start;margin-bottom:16px}
.step-num{background:#1E4D2B;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.step-text{font-size:14px;line-height:1.6;padding-top:4px}
.url-box{background:#f0ede8;padding:12px;border-radius:8px;font-size:13px;word-break:break-all;margin-bottom:24px}
.url-box a{color:#1E4D2B;font-weight:700}
.btn{display:inline-block;padding:14px 32px;background:#1E4D2B;color:#fff;border-radius:10px;font-size:16px;font-weight:700;text-decoration:none}
.btn:hover{background:#153820}
.footer{font-size:12px;color:#8a8682;margin-top:30px}
</style>
</head>
<body>
<div class="card">
<div class="logo">📱</div>
<h1>上藤沢中学校 黒板</h1>
<p class="desc">iPadのホーム画面に追加してアプリとして使えます</p>
<div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://school-board-1.onrender.com/" alt="QRコード"></div>
<div class="steps">
<div class="step"><div class="step-num">1</div><div class="step-text">iPad で <strong>Safari</strong> を開く</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">アドレスバーに下のURLを入力して開く</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">共有ボタン <span style="font-size:18px">⎙</span> をタップ</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">「<strong>ホーム画面に追加</strong>」をタップ</div></div>
<div class="step"><div class="step-num">5</div><div class="step-text">右上の「追加」をタップして完了</div></div>
</div>
<div class="url-box"><a href="https://school-board-1.onrender.com/">https://school-board-1.onrender.com/</a></div>
<a class="btn" href="https://school-board-1.onrender.com/">開く</a>
</div>
<div class="footer">上藤沢中学校 部活動黒板システム</div>
</body>
</html>
