<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ユーザー設定 - 上藤沢中学校</title>
<style>
:root{--primary:#1E4D2B;--primary-dark:#153820;--primary-light:#2D6B40;--bg:#f7f5f0;--card:#fff;--text:#2c2c2c;--sub:#8a8682;--border:#e0dcd4;--radius:12px;--shadow:0 2px 12px rgba(30,77,43,0.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--primary);padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.header-title{font-size:16px;font-weight:700;color:#fff}
.header-right{display:flex;gap:8px}
.header-link{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);padding:4px 12px;font-size:12px;cursor:pointer;color:rgba(255,255,255,.85);border-radius:8px;text-decoration:none;font-family:inherit}
.header-link:hover{background:rgba(255,255,255,.25);color:#fff}
.main{max-width:500px;margin:0 auto;padding:20px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#faf8f5;transition:all .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(30,77,43,0.08)}
.btn{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn:hover{background:#153820;box-shadow:0 4px 12px rgba(30,77,43,0.2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:0 0;border:2px solid var(--border);color:var(--sub)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);box-shadow:none}
.success{color:#2d6b4a;font-size:13px;margin-top:6px}
.error{color:var(--danger);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<header class="header">
  <div class="header-title">⚙️ ユーザー設定</div>
  <div class="header-right">
    <a href="01index.html" class="header-link">黒板に戻る</a>
  </div>
</header>
<div class="main">
  <div class="card">
    <h2>プロフィール</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="form-group" style="flex:1;min-width:70px"><label>学年</label><input type="number" id="sGrade" min="1" max="3" style="width:100%"></div>
      <div class="form-group" style="flex:1;min-width:70px"><label>クラス</label><input type="number" id="sClass" min="1" max="10" style="width:100%"></div>
      <div class="form-group" style="flex:1;min-width:70px"><label>番号</label><input type="number" id="sSeat" min="1" max="50" style="width:100%"></div>
    </div>
    <div class="form-group"><label>表示名</label><input type="text" id="sDispName" placeholder="表示名"></div>
    <div class="form-group"><label>部活動</label><select id="sClub"><option value="">—</option></select></div>
    <div class="form-group"><label>委員会</label><select id="sCommittee"><option value="">—</option></select></div>
    <button class="btn" id="saveProfile">保存</button>
    <div id="profileStatus"></div>
  </div>
  <div class="card">
    <h2>パスワード変更</h2>
    <div class="form-group"><label>現在のパスワード</label><input type="password" id="sCurPw"></div>
    <div class="form-group"><label>新しいパスワード</label><input type="password" id="sNewPw"></div>
    <div class="form-group"><label>新しいパスワード（確認）</label><input type="password" id="sNewPw2"></div>
    <button class="btn" id="changePwBtn">変更</button>
    <div id="pwStatus"></div>
  </div>
  <div class="card">
    <h2>🔔 プッシュ通知</h2>
    <p style="font-size:13px;color:var(--sub);margin-bottom:10px" id="pushStatus"></p>
    <button class="btn" id="pushEnableBtn">🔔 通知を有効にする</button>
    <button class="btn btn-outline" id="pushDisableBtn" style="display:none">🔕 通知を解除</button>
    <div id="pushTestResult" style="margin-top:6px;font-size:12px"></div>
  </div>
</div>
<script>
const API_BASE=''
async function a(p,o={}){const t=sessionStorage.getItem('token'),h={'Content-Type':'application/json',...o.headers};if(t)h['Authorization']='Bearer '+t;const r=await fetch(API_BASE+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw new Error(d.error||'エラー');return d}
const $=id=>document.getElementById(id);
if(!sessionStorage.getItem('token'))window.location.href='02login.html';
const CLUBS=['吹奏楽部','茶道部','美術部','卓球部','テニス部女子','テニス部男子','サッカー部','野球部','陸上部','バスケ部女子','バスケ部男子','バレー部'];
CLUBS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('sClub').appendChild(o)});
function populateCommitteeSelect(sel){
  sel.innerHTML='<option value="">—</option>';
  const groups={'学級委員会':['1学年委員会','2学年委員会','3学年委員会'],'専門委員会':['整備委員会','生活委員会','選挙管理委員会','図書委員会','給食委員会','合唱委員会','体育委員会','保健委員会','放送委員会'],'特別委員会':['中央委員会','部活動委員会']};
  for(const[g,items]of Object.entries(groups)){const og=document.createElement('optgroup');og.label=g;items.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;og.appendChild(o)});sel.appendChild(og)}
}
populateCommitteeSelect($('sCommittee'));

async function loadProfile(){try{const u=await a('/api/me');$('sDispName').value=u.display_name||'';if(u.grade)$('sGrade').value=u.grade;if(u.class_num)$('sClass').value=u.class_num;if(u.seat_num)$('sSeat').value=u.seat_num;if(u.club)$('sClub').value=u.club;if(u.committee)$('sCommittee').value=u.committee}catch(e){}}
loadProfile();

$('saveProfile').addEventListener('click',async()=>{
  const dn=$('sDispName').value.trim(),club=$('sClub').value,comm=$('sCommittee').value;
  const grade=$('sGrade').value,cls=$('sClass').value,seat=$('sSeat').value;
  try{const r=await a('/api/me',{method:'PUT',body:JSON.stringify({display_name:dn,club,committee:comm,grade,class_num:cls,seat_num:seat})});if(r.token){sessionStorage.setItem('token',r.token);if(r.display_name)sessionStorage.setItem('display_name',r.display_name)}$('profileStatus').textContent='✅ 保存しました';$('profileStatus').className='success';loadProfile()}catch(e){$('profileStatus').textContent='❌ '+e.message;$('profileStatus').className='error'}
});
$('changePwBtn').addEventListener('click',async()=>{
  const cur=$('sCurPw').value,pw=$('sNewPw').value,pw2=$('sNewPw2').value;
  if(!cur||!pw){$('pwStatus').textContent='入力してください';$('pwStatus').className='error';return}
  if(pw.length<6){$('pwStatus').textContent='6文字以上必要です';$('pwStatus').className='error';return}
  if(pw!==pw2){$('pwStatus').textContent='パスワードが一致しません';$('pwStatus').className='error';return}
  try{await a('/api/me/password',{method:'POST',body:JSON.stringify({currentPassword:cur,newPassword:pw})});$('pwStatus').textContent='✅ 変更しました';$('pwStatus').className='success';$('sCurPw').value='';$('sNewPw').value='';$('sNewPw2').value=''}catch(e){$('pwStatus').textContent='❌ '+e.message;$('pwStatus').className='error'}
});

// Push notification
function urlBase64ToUint8Array(b){const p=(b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');const s=atob(p);const r=new Uint8Array(s.length);for(let i=0;i<s.length;i++)r[i]=s.charCodeAt(i);return r}
function isPwa(){return window.navigator.standalone||window.matchMedia('(display-mode:standalone)').matches}
function swReady(timeout=3000){return Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(new Error('ServiceWorkerタイムアウト')),timeout))])}
async function loadPushSettings(){
  const st=$('pushStatus'),eb=$('pushEnableBtn'),db=$('pushDisableBtn'),tr=$('pushTestResult');
  try{
    const reg=await swReady();
    const sub=await reg.pushManager.getSubscription();
    if(sub){st.innerHTML='✅ プッシュ通知が有効です';eb.style.display='none';db.style.display='';tr.textContent=''}
    else if(Notification.permission==='denied'){st.innerHTML='❌ 通知が拒否されています。ブラウザの設定から許可してください';eb.style.display='none';db.style.display='none'}
    else if(!isPwa()&&/iPad|iPhone|iPod/.test(navigator.userAgent)){st.innerHTML='📱 ホーム画面に追加してから通知を有効にしてください';eb.style.display='none';db.style.display='none'}
    else{st.innerHTML='🔔 通知を有効にするとお知らせが届くようになります';eb.style.display='';db.style.display='none';tr.textContent=''}
  }catch(e){st.textContent='⚠️ '+e.message}
}
$('pushEnableBtn').addEventListener('click',async()=>{
  try{
    const p=await Notification.requestPermission();
    if(p!=='granted'){alert('通知が許可されませんでした');return}
    const reg=await swReady();
    const vk=await a('/api/push/vapid-key');
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(vk.publicKey)});
    await a('/api/push/subscribe',{method:'POST',body:JSON.stringify(JSON.parse(JSON.stringify(sub)))});
    loadPushSettings();
  }catch(e){alert('エラー: '+e.message)}
});
$('pushDisableBtn').addEventListener('click',async()=>{
  try{
    const reg=await swReady();
    const sub=await reg.pushManager.getSubscription();
    if(sub)await sub.unsubscribe();
    await a('/api/push/unsubscribe',{method:'POST'});
    loadPushSettings();
  }catch(e){alert('エラー: '+e.message)}
});
setTimeout(loadPushSettings, 500);
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
