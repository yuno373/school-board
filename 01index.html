<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>上藤沢中学校 部活動黒板</title>
<style>
:root{
  --primary:#1E4D2B;
  --primary-dark:#153820;
  --primary-light:#2D6B40;
  --accent-pink:#f5a0b8;
  --accent-blue:#a0c4e8;
  --accent-yellow:#f5e6a0;
  --accent-green:#a8d8a0;
  --bg:#f7f5f0;
  --card:#fff;
  --text:#2c2c2c;
  --sub:#8a8682;
  --border:#e0dcd4;
  --danger:#c96565;
  --radius:12px;
  --shadow:0 2px 12px rgba(30,77,43,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  min-height:100vh;
}
.dashboard{
  display:flex;
  width:100%;
  overflow:hidden;
}
/* Sidebar */
.sidebar{
  width:240px;
  background:var(--card);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}
.sidebar-header{
  padding:16px;
  border-bottom:1px solid var(--border);
}
.school-name{
  font-size:18px;
  font-weight:700;
  color:var(--primary);
  margin-bottom:8px;
}
.date-info{
  font-size:14px;
  color:var(--sub);
}
.sidebar-nav{
  flex:1;
  padding:8px 0;
}
.nav-button{
  width:100%;
  padding:12px 16px;
  margin:4px 8px;
  text-align:left;
  background:none;
  border:none;
  border-left:3px solid transparent;
  color:var(--sub);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:all .2s;
}
.nav-button:hover{
  background:#f0ede8;
  color:var(--text);
  border-left-color:var(--primary);
}
.nav-button.active{
  background:var(--primary);
  color:#fff;
  border-left-color:var(--primary);
}
.nav-button.disabled{
  opacity:0.5;
  cursor:not-allowed;
}
.sidebar-footer{
  padding:16px;
  border-top:1px solid var(--border);
}
.app-links{
  display:flex;
  gap:12px;
}
.app-link{
  flex:1;
  padding:12px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:8px;
  text-align:center;
  font-size:12px;
  color:var(--text);
  text-decoration:none;
  transition:all .2s;
}
.app-link:hover{
  background:rgba(255,255,255,.2);
  border-color:var(--primary);
}
.app-link-icon{
  font-size:18px;
  margin-bottom:4px;
  display:block;
}
/* Main content */
.main-content{
  flex:1;
  display:flex;
  flex-direction:column;
}
.header-bar{
  height:60px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
}
.user-info{
  font-size:16px;
  font-weight:600;
  color:var(--text);
}
.content-area{
  flex:1;
  overflow-y:auto;
  padding:20px;
}
.loading{
  text-align:center;
  padding:40px;
  color:var(--sub);
}
.empty-state{
  text-align:center;
  padding:40px;
  color:var(--sub);
}
/* Responsive */
@media(max-width:768px){
  .dashboard{
    flex-direction:column;
  }
  .sidebar{
    width:100%;
    height:60px;
    flex-direction:row;
  }
  .sidebar-header{
    display:none;
  }
  .sidebar-nav{
    display:flex;
    overflow-x:auto;
    padding:8px;
  }
  .nav-button{
    padding:12px 8px;
    white-space:nowrap;
  }
  .sidebar-footer{
    display:none;
  }
  .header-bar{
    height:50px;
    padding:0 16px;
  }
}
</style>
</head>
<body>
<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="school-name">上藤沢中学校部活動黒板</div>
      <div class="date-info" id="date-info">--月--日(--)</div>
    </div>
    <nav class="sidebar-nav">
      <!-- Buttons will be inserted here by JavaScript -->
    </nav>
    <div class="sidebar-footer">
      <div class="app-links">
        <a href="https://miraiseed2.benesse.ne.jp/seed/start/FpgtwCRY" target="_blank" rel="noopener" class="app-link">
          <div class="app-link-icon">📚</div>
          ミライシード
        </a>
        <a href="https://ed-cl.com" target="_blank" rel="noopener" class="app-link">
          <div class="app-link-icon">📖</div>
          メクビット
        </a>
      </div>
    </div>
  </aside>
  
  <!-- Main Content -->
  <main class="main-content">
    <div class="header-bar">
      <div class="user-info" id="user-info">読み込み中...</div>
    </div>
    <div class="content-area" id="content-area">
      <div class="loading">読み込み中...</div>
    </div>
  </main>
</div>

<script>
// API base (proxy to Worker)
const API_BASE = '';

// Authentication helper (simplified)
const AUTH = {
  getUser() {
    const u = sessionStorage.getItem('username');
    const r = sessionStorage.getItem('role');
    return u && r ? {username: u, role: r} : null;
  },
  requireAuth() {
    const u = this.getUser();
    if (!u) {
      window.location.href = '02login.html';
      return null;
    }
    return u;
  },
  canPost() {
    const u = this.getUser();
    return u && ['admin','teacher','president','vice-president','chairperson'].some(r => 
      (u.role || '').split(',').map(s => s.trim()).includes(r)
    );
  },
  async api(path, options = {}) {
    const token = sessionStorage.getItem('token');
    const headers = {
      'Content-Type': 'application/json',
      ...options.headers
    };
    if (token) {
      headers['Authorization'] = 'Bearer ' + token;
    }
    const response = await fetch(API_BASE + path, {
      ...options,
      headers
    });
    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || 'エラー');
    }
    return data;
  }
};

// Date formatting
function updateDateInfo() {
  const dateInfo = document.getElementById('date-info');
  if (!dateInfo) return;
  
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const weekDay = ['日','月','火','水','木','金','土'][now.getDay()];
  
  dateInfo.textContent = `${month}月${day}日(${weekDay})`;
}

// User info display
function updateUserInfo() {
  const userInfo = document.getElementById('user-info');
  if (!userInfo) return;
  
  const user = AUTH.getUser();
  if (!user) {
    userInfo.textContent = 'ユーザー情報取得中...';
    return;
  }
  
  const grade = user.grade || '';
  const classNum = user.class_num || '';
  const seatNum = user.seat_num || '';
  const username = user.username || '';
  const displayName = user.display_name || user.username || '';
  const club = user.club || '';
  const committee = user.committee || '';
  
  let info = '';
  if (grade) info += `学年:${grade} `;
  if (classNum) info += `クラス:${classNum} `;
  if (seatNum) info += `番号:${seatNum} `;
  if (displayName || username) info += `名前:${displayName || username} `;
  if (club) info += `部活:${club} `;
  if (committee) info += `委員会:${committee}`;
  
  userInfo.textContent = info.trim() || '情報なし';
}

// Navigation button creation
function createNavButtons() {
  const nav = document.querySelector('.sidebar-nav');
  if (!nav) return;
  
  const user = AUTH.getUser();
  if (!user) return;
  
  // Clear existing buttons
  nav.innerHTML = '';
  
  // Get user roles and permissions
  const roles = (user.role || '').split(',').map(r => r.trim()).filter(Boolean);
  const isAdmin = roles.includes('admin');
  const isTeacher = roles.includes('teacher');
  const isPresident = roles.includes('president');
  const isVicePresident = roles.includes('vice-president');
  const isChairperson = roles.includes('chairperson');
  
  // Define navigation items with their visibility conditions
  const navItems = [
    { id: 'general', label: '上中連絡', icon: '📝', visible: true },
    { id: 'club_' + user.club, label: user.club || '部活', icon: '🏃‍♂️', visible: !!user.club },
    { id: 'committee_' + user.committee, label: user.committee || '委員会', icon: '👥', visible: !!user.committee },
    { id: 'central', label: '中央委員会', icon: '🏛️', visible: isAdmin || isTeacher || isPresident || isVicePresident || isChairperson },
    { id: 'club-committee', label: '部活動委員会', icon: '🏆', visible: isAdmin || isTeacher || isPresident || isVicePresident },
    { id: 'questions', label: '質問', icon: '❓', visible: true },
    { id: 'chat', label: 'メッセージ', icon: '💬', visible: true },
    { id: 'user-management', label: 'ユーザー管理', icon: '⚙️', visible: isAdmin || isTeacher }
  ];
  
  // Create buttons
  navItems.forEach(item => {
    if (!item.visible) return;
    
    const button = document.createElement('button');
    button.className = 'nav-button';
    button.dataset.id = item.id;
    button.innerHTML = `<span class="nav-icon">${item.icon}</span><span class="nav-label">${item.label}</span>`;
    
    // Disable button if no specific content (for empty categories)
    if (!user.club && item.id.startsWith('club_')) {
      button.classList.add('disabled');
    }
    if (!user.committee && item.id.startsWith('committee_')) {
      button.classList.add('disabled');
    }
    
    nav.appendChild(button);
  });
  
  // Add click handlers
  const buttons = nav.querySelectorAll('.nav-button:not(.disabled)');
  buttons.forEach(button => {
    button.addEventListener('click', () => {
      // Update active state
      buttons.forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      
      // Load content for this section
      loadContent(button.dataset.id);
    });
  });
  
  // Set default active button (first enabled one)
  const firstEnabled = nav.querySelector('.nav-button:not(.disabled)');
  if (firstEnabled) {
    firstEnabled.classList.add('active');
    loadContent(firstEnabled.dataset.id);
  }
}

// Content loading
async function loadContent(sectionId) {
  const contentArea = document.getElementById('content-area');
  if (!contentArea) return;
  
  contentArea.innerHTML = '<div class="loading">読み込み中...</div>';
  
  try {
    let content = '';
    
    switch (sectionId) {
      case 'general':
        content = await loadBulletinBoard('上中連絡');
        break;
      default:
        if (sectionId.startsWith('club_')) {
          const clubName = sectionId.substring(5); // Remove 'club_' prefix
          content = await loadBulletinBoard(clubName);
        } else if (sectionId.startsWith('committee_')) {
          const committeeName = sectionId.substring(10); // Remove 'committee_' prefix
          content = await loadBulletinBoard(committeeName);
        } else {
          // Handle special sections
          content = await loadSpecialSection(sectionId);
        }
        break;
    }
    
    contentArea.innerHTML = content;
    
    // If content is empty, show empty state
    if (!content || content.trim() === '') {
      contentArea.innerHTML = '<div class="empty-state">コンテンツがありません</div>';
    }
  } catch (error) {
    console.error('Error loading content:', error);
    contentArea.innerHTML = `<div class="empty-state">エラーが発生しました: ${error.message}</div>`;
  }
}

// Bulletin board content loader
async function loadBulletinBoard(category) {
  try {
    const posts = await AUTH.api(`/api/posts?category=${encodeURIComponent(category)}`);
    
    if (!posts || posts.length === 0) {
      return '<div class="empty-state">投稿がありません</div>';
    }
    
    let html = '';
    posts.forEach(post => {
      const date = new Date(post.created_at);
      const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
      
      html += `
        <div class="post-card">
          <div class="post-category">${escapeHtml(post.category)}</div>
          <div class="post-title">${escapeHtml(post.title)}</div>
          <div class="post-body">${escapeHtml(post.content)}</div>
          ${post.link && post.link.trim() ? `
            <div class="post-attachment">
              <a href="${escapeHtml(post.link)}" target="_blank" class="attachment">
                <span>🔗</span> ${escapeHtml(post.link)}
              </a>
            </div>
          ` : ''}
          <div class="post-footer">
            <div class="post-meta">
              ${escapeHtml(post.display_name || post.username)} • ${dateStr}
            </div>
          </div>
        </div>
      `;
    });
    
    return html;
  } catch (error) {
    throw new Error(`掲示板の読み込みに失敗しました: ${error.message}`);
  }
}

// Special section loader
async function loadSpecialSection(sectionId) {
  switch (sectionId) {
    case 'questions':
      return await loadQuestionsSection();
    case 'chat':
      return await loadChatSection();
    case 'user-management':
      return await loadUserManagementSection();
    default:
      return '<div class="empty-state">このセクションは実装中です</div>';
  }
}

// Questions section (simplified placeholder)
async function loadQuestionsSection() {
  return `
    <div class="section-header">
      <h2>質問・相談</h2>
      <p>部長・委員長への質問を送信できます。</p>
    </div>
    <div class="questions-form">
      <div class="form-group">
        <label for="question-title">タイトル</label>
        <input type="text" id="question-title" placeholder="質問のタイトルを入力">
      </div>
      <div class="form-group">
        <label for="question-content">内容</label>
        <textarea id="question-content" rows="4" placeholder="質問の内容を入力"></textarea>
      </div>
      <button id="submit-question" class="btn-primary">質問を送信</button>
    </div>
  `;
}

// Chat section (simplified placeholder)
async function loadChatSection() {
  return `
    <div class="section-header">
      <h2>メッセージ</h2>
      <p>部活・委員会のメンバーとチャットできます。</p>
    </div>
    <div id="chat-messages" class="chat-messages">
      <div class="empty-state">メッセージを読み込み中...</div>
    </div>
    <div class="chat-input">
      <input type="text" id="chat-message" placeholder="メッセージを入力...">
      <button id="send-chat" class="btn-primary">送信</button>
    </div>
  `;
}

// User management section (admin/teacher only)
async function loadUserManagementSection() {
  const user = AUTH.getUser();
  if (!user || !(user.role || '').includes('admin') && !(user.role || '').includes('teacher')) {
    return '<div class="empty-state">このページにアクセスする権限がありません</div>';
  }
  
  return `
    <div class="section-header">
      <h2>ユーザー管理</h2>
      <p>ユーザーの追加・編集・削除ができます。</p>
    </div>
    <div id="user-list" class="user-list">
      <div class="empty-state">ユーザー一覧を読み込み中...</div>
    </div>
    <div class="add-user-form">
      <h3>新規ユーザー追加</h3>
      <div class="form-group">
        <label for="new-username">ユーザーID</label>
        <input type="text" id="new-username" placeholder="例: 101005">
      </div>
      <div class="form-group">
        <label for="new-display-name">表示名</label>
        <input type="text" id="new-display-name" placeholder="氏名">
      </div>
      <div class="form-group">
        <label for="new-password">パスワード</label>
        <input type="password" id="new-password" placeholder="パスワード">
      </div>
      <div class="form-group">
        <label for="new-role">役割</label>
        <select id="new-role">
          <option value="student">生徒</option>
          <option value="teacher">先生</option>
          <option value="president">部長</option>
          <option value="vice-president">副部長</option>
          <option value="chairperson">委員長</option>
          <option value="admin">管理者</option>
        </select>
      </div>
      <div class="form-group">
        <label for="new-grade">学年</label>
        <select id="new-grade">
          <option value="">選択してください</option>
          <option value="1">1年</option>
          <option value="2">2年</option>
          <option value="3">3年</option>
        </select>
      </div>
      <div class="form-group">
        <label for="new-class">クラス</label>
        <input type="number" id="new-class" min="1" max="10" placeholder="クラス番号">
      </div>
      <div class="form-group">
        <label for="new-seat">席番号</label>
        <input type="number" id="new-seat" min="1" max="50" placeholder="席番号">
      </div>
      <button id="add-user" class="btn-primary">ユーザーを追加</button>
    </div>
  `;
}

// Utility functions
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Initialize dashboard
async function initDashboard() {
  // Update date and user info
  updateDateInfo();
  updateUserInfo();
  
  // Create navigation buttons
  createNavButtons();
  
  // Set up interval updates
  setInterval(updateDateInfo, 60000); // Update date every minute
  setInterval(updateUserInfo, 30000); // Update user info every 30 seconds
}

// Start initialization
document.addEventListener('DOMContentLoaded', initDashboard);
</script>
</body>
</html>
