<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>莠亥ｮ夊｡ｨ - 荳願陸豐｢荳ｭ蟄ｦ譬｡</title>
<style>
:root{--primary:#1E4D2B;--primary-dark:#153820;--primary-light:#2D6B40;--accent-pink:#f5a0b8;--accent-blue:#a0c4e8;--accent-yellow:#f5e6a0;--accent-green:#a8d8a0;--bg:#f7f5f0;--card:#fff;--text:#2c2c2c;--sub:#8a8682;--border:#e0dcd4;--radius:12px;--shadow:0 2px 12px rgba(30,77,43,0.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--primary);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header-title{font-size:16px;font-weight:700;color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.header-link{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);padding:4px 12px;font-size:12px;cursor:pointer;color:rgba(255,255,255,.85);border-radius:8px;text-decoration:none;transition:all .2s;font-family:inherit}
.header-link:hover{background:rgba(255,255,255,.25);color:#fff}
.main{display:flex;gap:20px;max-width:1100px;margin:0 auto;padding:20px;min-height:calc(100vh - 60px)}
@media(max-width:800px){.main{flex-direction:column}}
.schedule-area{flex:1;min-width:0}
.gemini-area{width:360px;flex-shrink:0;display:flex;flex-direction:column}
@media(max-width:800px){.gemini-area{width:100%}}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--text);display:flex;align-items:center;gap:8px}
.month-group{margin-bottom:20px}
.month-label{font-size:14px;font-weight:700;color:var(--primary);padding:8px 0;border-bottom:2px solid var(--primary);margin-bottom:8px}
.event-item{display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);align-items:start;transition:background .15s}
.event-item:hover{background:#faf8f5}
.event-date{font-size:12px;font-weight:700;color:var(--sub);min-width:80px;white-space:nowrap}
.event-info{flex:1}
.event-title{font-size:14px;font-weight:700;color:var(--text)}
.event-desc{font-size:12px;color:var(--sub);margin-top:2px}
.event-cat{display:inline-block;font-size:10px;font-weight:700;padding:1px 8px;border-radius:4px;margin-left:6px}
.cat-陦御ｺ宮background:var(--accent-blue);color:#1a4a6a}
.cat-驛ｨ豢ｻ{background:var(--accent-green);color:#1a4a2a}
.cat-蟋泌藤莨嘴background:var(--accent-yellow);color:#6a5a10}
.cat-縺昴・莉本background:#e0dcd4;color:#5a5a5a}
.del-btn{background:0 0;border:none;color:var(--danger);cursor:pointer;font-size:12px;opacity:.5;padding:2px 6px}
.del-btn:hover{opacity:1}
.form-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:end}
.form-row label{font-size:12px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;gap:3px}
.form-row input,.form-row select,.form-row textarea{padding:7px 10px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#faf8f5;transition:all .2s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--primary);background:#fff}
.form-row input[type=date]{width:140px}
.form-row input[type=text]{width:180px}
.form-row textarea{width:100%;min-height:50px;resize:vertical}
.btn{padding:8px 16px;font-size:13px;font-weight:700;border:none;border-radius:8px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(30,77,43,0.2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:0 0;border:2px solid var(--border);color:var(--sub)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}

/* Gemini chat */
.gemini-header{background:var(--primary);color:#fff;padding:12px 16px;border-radius:var(--radius) var(--radius) 0 0;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.gemini-msgs{flex:1;overflow-y:auto;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px;min-height:300px;max-height:500px;border-left:2px solid var(--border);border-right:2px solid var(--border)}
.gm-msg{padding:10px 14px;border-radius:12px;max-width:85%;font-size:13px;line-height:1.5;animation:fadeIn .2s}
.gm-msg.user{background:var(--accent-blue);color:#1a4a6a;align-self:flex-end;border-bottom-right-radius:4px}
.gm-msg.ai{background:#f0ede8;color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.gm-msg .gm-time{font-size:10px;color:var(--sub);margin-top:4px;opacity:.7}
.gm-msg.user .gm-time{color:rgba(26,74,106,.6)}
.gemini-input{display:flex;gap:6px;padding:12px;background:var(--card);border-radius:0 0 var(--radius) var(--radius);border:2px solid var(--border);border-top:none;align-items:center;flex-wrap:none}
.gemini-input input{flex:1;min-width:0;padding:10px 14px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;transition:all .2s}
.gemini-input input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,77,43,0.08)}
.gemini-input button{padding:8px 14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.gemini-input button:hover{background:var(--primary-dark)}
.gm-img-btn{background:0 0;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:16px;padding:6px 10px;transition:all .2s;flex-shrink:0;font-family:inherit;line-height:1}
.gm-img-btn:hover{border-color:var(--primary);background:#f0ede8}
.gm-preview{display:flex;gap:6px;padding:4px 12px 0;background:var(--card);border-left:2px solid var(--border);border-right:2px solid var(--border);align-items:start;flex-wrap:wrap}
.gm-preview img{max-height:80px;border-radius:6px;border:1px solid var(--border)}
.gm-preview .gm-prev-rm{background:0 0;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:2px}
.gm-msg img{max-width:100%;border-radius:8px;margin-top:6px;border:1px solid var(--border);max-height:200px;object-fit:contain}
.empty{text-align:center;padding:30px;color:var(--sub);font-size:13px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.thinking{animation:pulse 1s infinite}
</style>
</head>
<body>
<header class="header">
  <div class="header-title">套 蟷ｴ髢謎ｺ亥ｮ夊｡ｨ</div>
  <div class="header-right">
    <a href="01index.html" class="header-link">鮟呈攸縺ｫ謌ｻ繧・/a>
  </div>
</header>
<div class="main">
  <div class="schedule-area">
    <div class="card hidden" id="addFormCard">
      <h2>笨擾ｸ・莠亥ｮ壹ｒ霑ｽ蜉</h2>
      <div class="form-row"><label>譌･莉・input type="date" id="sDate"></label><label>譛茨ｼ磯寔險育畑・・select id="sMonth"></select></label><label>繧ｫ繝・ざ繝ｪ<select id="sCat"><option value="陦御ｺ・>陦御ｺ・/option><option value="驛ｨ豢ｻ">驛ｨ豢ｻ</option><option value="蟋泌藤莨・>蟋泌藤莨・/option><option value="縺昴・莉・>縺昴・莉・/option></select></label></div>
      <div class="form-row"><label>繧ｿ繧､繝医Ν<input type="text" id="sTitle" placeholder="莠亥ｮ壼錐"></label></div>
      <div class="form-row"><label>隱ｬ譏・textarea id="sDesc" placeholder="隱ｬ譏趣ｼ井ｻｻ諢擾ｼ・></textarea></label></div>
      <button class="btn btn-primary" id="addBtn">霑ｽ蜉</button>
      <button class="btn btn-outline" id="cancelAdd" style="margin-left:6px">繧ｭ繝｣繝ｳ繧ｻ繝ｫ</button>
    </div>
    <div id="scheduleList"></div>
  </div>
  <div class="gemini-area">
    <div class="gemini-header">､・Gemini 繝弱・繝医ヶ繝・け</div>
    <div class="gemini-msgs" id="gmMsgs"><div class="empty">蟷ｴ髢謎ｺ亥ｮ壹↓縺､縺・※雉ｪ蝠上〒縺阪∪縺・br>萓具ｼ壹梧ｬ｡縺ｮ菴楢ご逾ｭ縺ｯ縺・▽・溘・/div></div>
    <div id="gmPreview" class="gm-preview" style="display:none"></div>
    <div class="gemini-input"><input type="text" id="gmInput" placeholder="莠亥ｮ壹↓縺､縺・※雉ｪ蝠・.." maxlength="500"><button class="gm-img-btn" id="gmImgBtn" style="display:none" title="逕ｻ蜒上ｒ豺ｻ莉・>繝輔ぃ繧､繝ｫ</button><button id="gmBtn">騾∽ｿ｡</button><input type="file" id="gmFile" accept="image/*" style="display:none"></div>
  </div>
</div>
<script>
async function h(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
const API_BASE=''
async function a(p,o={}){const t=sessionStorage.getItem('token'),h={'Content-Type':'application/json',...o.headers};if(t)h['Authorization']='Bearer '+t;const r=await fetch(API_BASE+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw new Error(d.error||'繧ｨ繝ｩ繝ｼ');return d}
const $=id=>document.getElementById(id),esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const cu=sessionStorage.getItem('username'),role=sessionStorage.getItem('role');
if(!cu||!sessionStorage.getItem('token'))window.location.href='02login.html';
const isAdmin=(role||'').split(',').some(r=>['admin','teacher'].includes(r.trim()));

// Months
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'譛・;$('sMonth').appendChild(o)}
const now=new Date();$('sDate').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
$('sMonth').value=now.getMonth()+1;

// Show add form for admin/teacher
if(isAdmin){$('addFormCard').classList.remove('hidden');$('gmImgBtn').style.display=''} // image upload for admin/teacher only
$('cancelAdd').addEventListener('click',()=>{$('sTitle').value='';$('sDesc').value='';$('sDate').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')});

const months=['','1譛・,'2譛・,'3譛・,'4譛・,'5譛・,'6譛・,'7譛・,'8譛・,'9譛・,'10譛・,'11譛・,'12譛・];

async function loadSchedule(){
  const el=$('scheduleList');
  try{
    const data=await a('/api/yearly-schedule');
    if(!data.length){el.innerHTML='<div class="card"><div class="empty">莠亥ｮ壹′縺ｾ縺逋ｻ骭ｲ縺輔ｌ縺ｦ縺・∪縺帙ｓ</div></div>';return}
    const byMonth={};
    data.forEach(e=>{const m=parseInt(e.month)||1;if(!byMonth[m])byMonth[m]=[];byMonth[m].push(e)});
    let html='';
    for(let m=1;m<=12;m++){
      if(!byMonth[m]||!byMonth[m].length)continue;
      byMonth[m].sort((a,b)=>a.date.localeCompare(b.date));
      html+='<div class="month-group"><div class="month-label">'+months[m]+'</div>';
      byMonth[m].forEach(e=>{
        const d=new Date(e.date+'T00:00:00');
        const ds=(d.getMonth()+1)+'/'+d.getDate()+'('+'譌･譛育↓豌ｴ譛ｨ驥大悄'[d.getDay()]+')';
        const catCls='cat-'+esc(e.category||'縺昴・莉・);
        const delBtn=isAdmin?`<button class="del-btn" onclick="delEvent('${e.id}')">笨・/button>`:'';
        html+=`<div class="event-item"><div class="event-date">${ds}</div><div class="event-info"><span class="event-title">${esc(e.title)}<span class="event-cat ${catCls}">${esc(e.category||'')}</span></span>${e.description?`<div class="event-desc">${esc(e.description)}</div>`:''}</div>${delBtn}</div>`;
      });
      html+='</div>';
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="card"><div class="empty">隱ｭ縺ｿ霎ｼ縺ｿ繧ｨ繝ｩ繝ｼ</div></div>'}
}

async function delEvent(id){if(!confirm('蜑企勁縺励∪縺吶°・・))return;try{await a('/api/yearly-schedule/'+id,{method:'DELETE'});loadSchedule()}catch(e){}}
$('addBtn').addEventListener('click',async()=>{
  const title=$('sTitle').value.trim(),date=$('sDate').value,month=$('sMonth').value,cat=$('sCat').value,desc=$('sDesc').value.trim();
  if(!title||!date){alert('譌･莉倥→繧ｿ繧､繝医Ν縺ｯ蠢・医〒縺・);return}
  try{await a('/api/yearly-schedule',{method:'POST',body:JSON.stringify({title,date,month,category:cat,description:desc})});$('sTitle').value='';$('sDesc').value='';loadSchedule()}catch(e){alert(e.message)}
});
loadSchedule();

// Gemini notebook
let gmImageData=null;
$('gmImgBtn').addEventListener('click',()=>$('gmFile').click());
$('gmFile').addEventListener('change',()=>{
  const f=$('gmFile').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    gmImageData=r.result;
    const prev=$('gmPreview');prev.innerHTML='';prev.style.display='flex';
    const img=document.createElement('img');img.src=gmImageData;
    const rm=document.createElement('button');rm.className='gm-prev-rm';rm.textContent='笨・;
    rm.onclick=()=>{gmImageData=null;prev.style.display='none';prev.innerHTML='';$('gmFile').value=''};
    prev.appendChild(img);prev.appendChild(rm);
  };
  r.readAsDataURL(f);
});
$('gmBtn').addEventListener('click',askGemini);
$('gmInput').addEventListener('keydown',e=>{if(e.key==='Enter')askGemini()});
async function askGemini(){
  const q=$('gmInput').value.trim();
  if(!q&&!gmImageData)return;
  const msgs=$('gmMsgs');
  if(msgs.querySelector('.empty'))msgs.innerHTML='';
  let userHtml=esc(q||'逕ｻ蜒上ｒ騾∽ｿ｡');
  if(gmImageData)userHtml+=`<br><img src="${gmImageData}" alt="豺ｻ莉倡判蜒・>`;
  msgs.innerHTML+=`<div class="gm-msg user">${userHtml}<div class="gm-time">縺ゅ↑縺・/div></div>`;
  $('gmInput').value='';
  const prev=$('gmPreview');prev.style.display='none';prev.innerHTML='';
  const imgData=gmImageData;gmImageData=null;$('gmFile').value='';
  const thinkingDiv=document.createElement('div');thinkingDiv.className='gm-msg ai thinking';thinkingDiv.textContent='閠・∴荳ｭ...';msgs.appendChild(thinkingDiv);
  msgs.scrollTop=msgs.scrollHeight;
  try{
    const body={question:q||'逕ｻ蜒上↓縺､縺・※隱ｬ譏弱＠縺ｦ縺上□縺輔＞'};
    if(imgData)body.image=imgData;
    const r=await a('/api/gemini/ask',{method:'POST',body:JSON.stringify(body)});
    thinkingDiv.remove();
    msgs.innerHTML+=`<div class="gm-msg ai">${esc(r.answer||'蝗樒ｭ斐ｒ逕滓・縺ｧ縺阪∪縺帙ｓ縺ｧ縺励◆')}<div class="gm-time">Gemini</div></div>`;
  }catch(e){thinkingDiv.remove();msgs.innerHTML+=`<div class="gm-msg ai">繧ｨ繝ｩ繝ｼ縺檎匱逕溘＠縺ｾ縺励◆<div class="gm-time">Gemini</div></div>`}
  msgs.scrollTop=msgs.scrollHeight;
}
</script>
</body>
</html>
