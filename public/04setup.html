<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>蛻晄悄繧ｻ繝・ヨ繧｢繝・・ - 荳願陸豐｢荳ｭ蟄ｦ譬｡驛ｨ豢ｻ蜍暮ｻ呈攸</title>
<link rel="stylesheet" href="01style.css">
</head>
<body class="setup-body">
<div class="setup-box">
<h1>荳願陸豐｢荳ｭ蟄ｦ譬｡<br>驛ｨ豢ｻ蜍暮ｻ呈攸</h1>
<p class="setup-subtitle">蛻晏屓繧ｻ繝・ヨ繧｢繝・・</p>
<p style="font-size:13px;color:#888;margin-bottom:20px;padding:12px 14px;background:#fafafa;border:1px solid #eee">繧ｵ繝ｼ繝舌・襍ｷ蜍募ｾ後√％縺ｮ繝壹・繧ｸ縺ｧ邂｡逅・・い繧ｫ繧ｦ繝ｳ繝医ｒ菴懈・縺励∪縺・/p>
<label>邂｡逅・・Θ繝ｼ繧ｶ繝ｼ蜷・/label>
<input type="text" id="sUser" value="螟ｧ隕・>
<label>繝代せ繝ｯ繝ｼ繝・/label>
<input type="password" id="sPass" value="112661">
<button class="setup-btn" id="sBtn">邂｡逅・・い繧ｫ繧ｦ繝ｳ繝医ｒ菴懈・</button>
<div class="setup-success" id="sOk">菴懈・縺励∪縺励◆・・br><a href="02login.html" style="color:#222;font-weight:700">繝ｭ繧ｰ繧､繝ｳ繝壹・繧ｸ縺ｸ</a></div>
<div class="setup-error" id="sErr"></div>
</div>
<script>
const API_BASE=''
async function hashPassword(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
const $=id=>document.getElementById(id);
$('sBtn').addEventListener('click',async()=>{
  const u=$('sUser').value.trim(),p=$('sPass').value.trim();
  $('sOk').style.display='none';$('sErr').textContent='';
  if(!u||!p){$('sErr').textContent='蜈･蜉帙＠縺ｦ縺上□縺輔＞';return}
  if(p.length<6){$('sErr').textContent='6譁・ｭ嶺ｻ･荳・;return}
  $('sBtn').disabled=true;$('sBtn').textContent='菴懈・荳ｭ...';
  try{
    const h=await hashPassword(p);
    const r=await fetch(API_BASE+'/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:h,role:'admin'})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error);
    $('sOk').style.display='block';$('sBtn').textContent='笨・螳御ｺ・;
  }catch(e){$('sErr').textContent='繧ｨ繝ｩ繝ｼ: '+e.message;$('sBtn').disabled=false;$('sBtn').textContent='邂｡逅・・い繧ｫ繧ｦ繝ｳ繝医ｒ菴懈・'}
});
</script>
</body>
</html>
