<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>荳願陸豐｢荳ｭ蟄ｦ譬｡ 驛ｨ豢ｻ蜍暮ｻ呈攸</title>
<style>
:root{--primary:#1E4D2B;--primary-dark:#153820;--primary-light:#2D6B40;--accent-pink:#f5a0b8;--accent-blue:#a0c4e8;--accent-yellow:#f5e6a0;--accent-green:#a8d8a0;--bg:#f7f5f0;--card:#fff;--text:#2c2c2c;--sub:#8a8682;--border:#e0dcd4;--danger:#c96565;--radius:12px;--shadow:0 2px 12px rgba(30,77,43,0.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--primary);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header-title{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.header-title .hd{display:inline-flex;align-items:center;gap:6px}
.header-title .hdate{font-size:12px;font-weight:400;opacity:.8;white-space:nowrap}
.header-title .hwbgt{font-size:11px;font-weight:700;padding:2px 10px;border-radius:6px}
.header-title .hdisaster{font-size:11px;font-weight:700;padding:2px 10px;border-radius:6px}
.hd-info{background:rgba(46,125,50,.35)}
.hd-warning{background:rgba(230,81,0,.35)}
.hd-danger{background:rgba(198,40,40,.35)}
.hw0{background:rgba(46,125,50,.35)}
.hw1{background:rgba(245,127,23,.35)}
.hw2{background:rgba(230,81,0,.35)}
.hw3{background:rgba(198,40,40,.35)}
.hw4{background:rgba(106,27,154,.35)}
.header-right{display:flex;align-items:center;gap:8px}
.user-badge{background:rgba(255,255,255,.2);color:#fff;font-size:11px;padding:3px 10px;border-radius:6px;font-weight:700}
.header-link{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);padding:4px 12px;font-size:12px;cursor:pointer;color:rgba(255,255,255,.85);border-radius:8px;text-decoration:none;transition:all .2s;font-family:inherit;white-space:nowrap}
.header-link:hover{background:rgba(255,255,255,.25);color:#fff}
.header-link.danger{border-color:rgba(255,255,255,.2)}
.header-link.danger:hover{border-color:rgba(200,100,100,.6);background:rgba(200,100,100,.2);color:#ffcdcd}
.nav-container{background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.nav-container::-webkit-scrollbar{display:none}
.nav-tabs{display:flex;padding:0 10px}
.tab{padding:10px 16px;color:var(--sub);text-decoration:none;font-size:13px;font-weight:700;border-bottom:3px solid transparent;transition:all .2s;cursor:pointer;background:0 0;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab.active{color:#fff;background:var(--primary);border-radius:8px 8px 0 0;border-bottom-color:var(--primary)}
.tab:hover:not(.active){background:#f0ede8;color:var(--text);border-radius:8px 8px 0 0}
.tab.separator{color:#b5b0a8;padding:10px 6px;font-size:11px;font-weight:600;cursor:pointer}
.tab-dot{display:inline-flex;align-items:center;justify-content:center;background:var(--accent-pink);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;margin-left:5px;vertical-align:middle;border-radius:9px}
.search-bar{padding:8px 14px;display:flex;gap:8px;justify-content:center;position:sticky;top:0;z-index:89;background:var(--bg)}
.search-bar input{width:100%;max-width:400px;padding:8px 14px;border:2px solid var(--border);border-radius:20px;font-size:13px;font-family:inherit;background:var(--card);transition:all .2s;box-shadow:var(--shadow)}
.search-bar input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(30,77,43,0.08)}
.main-content{max-width:800px;margin:0 auto;padding:16px 20px}
.post-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px;transition:transform .15s;border-left:3px solid var(--primary-light)}
.post-card:hover{transform:translateY(-1px)}
.post-category{font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:600}
.post-title{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text)}
.post-body{font-size:14px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.attachment{display:inline-flex;align-items:center;background:#f5f2ec;border:1px solid var(--border);padding:5px 10px;border-radius:6px;font-size:13px;color:var(--text);margin-bottom:12px;text-decoration:none;transition:all .2s}
.attachment:hover{border-color:var(--primary);background:#eaf3e8}
.post-footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;border-top:1px solid var(--border);padding-top:10px}
.post-meta{color:var(--sub)}
.post-deadline{color:var(--danger);font-weight:700;background:#fce8e8;padding:3px 10px;border-radius:6px;font-size:11px}
.post-deadline.safe{color:var(--primary);background:#eaf3e8}
.post-deadline.warn{color:#c97b4a;background:#faf0e0}
#postForm{background:var(--card);padding:18px 20px;margin-bottom:18px;border-radius:var(--radius);box-shadow:var(--shadow)}
#postForm.hidden{display:none}
#postForm h2{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text)}
#postForm input,#postForm textarea,#postForm select{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#faf8f5;transition:all .25s}
#postForm input:focus,#postForm textarea:focus,#postForm select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(30,77,43,0.08)}
#postForm input{margin-bottom:10px}
#postForm textarea{min-height:90px;resize:vertical;margin-bottom:10px}
#postForm select{margin-bottom:10px;cursor:pointer}
#postForm .form-row{display:flex;gap:10px;margin-bottom:10px}
#postForm .form-row input{flex:1;margin-bottom:0}
#createBtn{background:var(--primary);color:#fff;border:none;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;border-radius:8px;transition:all .25s;font-family:inherit}
#createBtn:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(30,77,43,0.2)}
#createBtn:disabled{opacity:.5;cursor:not-allowed}
.delete-btn{background:0 0;border:1px solid var(--border);color:var(--sub);padding:4px 10px;font-size:11px;cursor:pointer;border-radius:6px;transition:all .2s;font-family:inherit}
.delete-btn:hover{border-color:var(--danger);color:var(--danger);background:#fce8e8}
.empty-state{text-align:center;padding:50px 20px;color:#c5c0b8;font-size:14px}
#wbgtBar{display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:13px;font-weight:700;transition:background .5s,color .5s;overflow-x:auto}
.wbgt-val{font-size:18px;min-width:45px;text-align:center;font-weight:800}
.wbgt-label{font-size:13px;font-weight:700}
.wbgt-advice{font-size:12px;font-weight:400;opacity:.9}
.wbgt-detail{display:flex;gap:8px;font-weight:400;font-size:11px;opacity:.8}
.wbgt-l0{background:#eaf3e8;color:#2d6b4a}
.wbgt-l1{background:#faf5e0;color:#b57a20}
.wbgt-l2{background:#faf0e0;color:#c97b4a}
.wbgt-l3{background:#fce8e8;color:#b54a4a}
.wbgt-l4{background:#f3eaf5;color:#7a3a8a}
#disasterBar{display:none;align-items:center;gap:8px;padding:6px 20px;font-size:12px;font-weight:700;transition:all .3s;overflow-x:auto;border-bottom:1px solid rgba(200,0,0,.15)}
.disaster-icon{font-size:14px;flex-shrink:0}
.disaster-msg{flex:1;font-size:12px}
.disaster-danger{background:#fce8e8;color:#b54a4a}
.disaster-warning{background:#faf5e0;color:#b57a20}
.disaster-info{background:#eaf3e8;color:#2d6b4a}
.disaster-clear{background:rgba(255,255,255,.15);border:none;color:inherit;font-size:10px;opacity:.7;cursor:pointer;padding:2px 8px;border-radius:4px;font-weight:700}
.disaster-clear:hover{opacity:1;background:rgba(0,0,0,.1)}
.claim-area{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.claim-btn{padding:6px 14px;font-size:12px;font-weight:700;border:2px solid var(--accent-pink);background:0 0;color:var(--accent-pink);border-radius:8px;cursor:pointer;transition:all .2s;font-family:inherit}
.claim-btn:hover{background:var(--accent-pink);color:#fff}
.claim-btn.claimed{background:var(--accent-pink);color:#fff}
.claim-count{font-size:12px;color:var(--sub);font-weight:700}
.reaction-bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.reaction-btn{font-size:13px;padding:3px 10px;border:1.5px solid var(--border);border-radius:16px;background:var(--card);cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:4px}
.reaction-btn:hover{border-color:var(--accent-blue);background:#f0f6fc}
.reaction-btn.active{background:var(--accent-blue);border-color:var(--accent-blue);color:#1a4a6a}
.reaction-btn .count{font-size:11px;font-weight:700;color:var(--sub)}
.reaction-btn.active .count{color:inherit}
.notif-badge{background:var(--accent-pink);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;margin-left:4px;vertical-align:middle;text-align:center;line-height:18px;display:none}
@media(max-width:600px){
  .header{flex-direction:column;align-items:flex-start;gap:8px}
  .header-right{width:100%;justify-content:space-between;flex-wrap:wrap}
  .main-content{padding:12px 14px}
  .post-card{padding:14px 16px}
}
</style>

<body>
<header class="header">
  <div class="header-title"><span class="hd">搭 荳願陸豐｢荳ｭ蟄ｦ譬｡</span><span class="hdate" id="hDate"></span><span class="hwbgt" id="hWbgt" style="display:none"></span><span class="hdisaster" id="hDisaster" style="display:none"></span></div>

<script>
async function h(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
const API_BASE=''
async function a(p,o={}){const t=sessionStorage.getItem('token'),h={'Content-Type':'application/json',...o.headers};if(t)h['Authorization']='Bearer '+t;const r=await fetch(API_BASE+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw new Error(d.error||'繧ｨ繝ｩ繝ｼ');return d}
function hasRole(r,t){return (r||'').split(',').map(s=>s.trim()).some(s=>t.includes(s))}
const A={async login(u,p){const k=await h(p),d=await a('/api/login',{method:'POST',body:JSON.stringify({username:u,password:k})});sessionStorage.setItem('token',d.token);sessionStorage.setItem('username',d.username);sessionStorage.setItem('role',d.role);return d},logout(){sessionStorage.clear()},getUser(){const u=sessionStorage.getItem('username'),r=sessionStorage.getItem('role');return u&&r?{username:u,role:r}:null},requireAuth(){const u=this.getUser();if(!u){window.location.href='02login.html';return null}return u},canManageUsers(){const u=this.getUser();return u&&hasRole(u.role,['admin','teacher'])},canPost(){const u=this.getUser();return u&&hasRole(u.role,['admin','teacher','president','vice-president','chairperson'])},async api(p,o){return a(p,o)},hashPassword(p){return h(p)}};window.AUTH=A;window.api=a

const CATS=[
{l:'荳贋ｸｭ騾｣邨｡',n:'荳贋ｸｭ騾｣邨｡'},
{l:'蠢倥ｌ迚ｩ',n:'蠢倥ｌ迚ｩ'},
{l:'逕溷ｾ剃ｼ・,n:'逕溷ｾ剃ｼ・},
{l:'3蟄ｦ蟷ｴ蟋泌藤莨・,n:'3蟄ｦ蟷ｴ蟋泌藤莨・},{l:'2蟄ｦ蟷ｴ蟋泌藤莨・,n:'2蟄ｦ蟷ｴ蟋泌藤莨・},{l:'1蟄ｦ蟷ｴ蟋泌藤莨・,n:'1蟄ｦ蟷ｴ蟋泌藤莨・},
{l:'荳ｭ螟ｮ蟋泌藤莨・,n:'荳ｭ螟ｮ蟋泌藤莨・,roles:['admin','teacher','president','vice-president','chairperson']},
{l:'驛ｨ豢ｻ蜍募ｧ泌藤莨・,n:'驛ｨ豢ｻ蜍募ｧ泌藤莨・,roles:['admin','teacher','president','vice-president','chairperson']},
{l:'窶・驛ｨ豢ｻ蜍・窶・,g:true},
{l:'蜷ｹ螂乗･ｽ驛ｨ',n:'蜷ｹ螂乗･ｽ驛ｨ'},{l:'闌ｶ驕馴Κ',n:'闌ｶ驕馴Κ'},{l:'鄒手｡馴Κ',n:'鄒手｡馴Κ'},{l:'蜊鍋帥驛ｨ',n:'蜊鍋帥驛ｨ'},
{l:'繝・ル繧ｹ驛ｨ螂ｳ蟄・,n:'繝・ル繧ｹ驛ｨ螂ｳ蟄・},{l:'繝・ル繧ｹ驛ｨ逕ｷ蟄・,n:'繝・ル繧ｹ驛ｨ逕ｷ蟄・},{l:'繧ｵ繝・き繝ｼ驛ｨ',n:'繧ｵ繝・き繝ｼ驛ｨ'},
{l:'驥守帥驛ｨ',n:'驥守帥驛ｨ'},{l:'髯ｸ荳企Κ',n:'髯ｸ荳企Κ'},{l:'繝舌せ繧ｱ驛ｨ螂ｳ蟄・,n:'繝舌せ繧ｱ驛ｨ螂ｳ蟄・},{l:'繝舌せ繧ｱ驛ｨ逕ｷ蟄・,n:'繝舌せ繧ｱ驛ｨ逕ｷ蟄・},{l:'繝舌Ξ繝ｼ驛ｨ',n:'繝舌Ξ繝ｼ驛ｨ'},
{l:'窶・蟋泌藤莨・窶・,g:true},
{l:'謨ｴ蛯吝ｧ泌藤莨・,n:'謨ｴ蛯吝ｧ泌藤莨・},{l:'逕滓ｴｻ蟋泌藤莨・,n:'逕滓ｴｻ蟋泌藤莨・},{l:'驕ｸ謖咏ｮ｡逅・ｧ泌藤莨・,n:'驕ｸ謖咏ｮ｡逅・ｧ泌藤莨・},{l:'蝗ｳ譖ｸ蟋泌藤莨・,n:'蝗ｳ譖ｸ蟋泌藤莨・},
{l:'邨ｦ鬟溷ｧ泌藤莨・,n:'邨ｦ鬟溷ｧ泌藤莨・},{l:'蜷亥罰蟋泌藤莨・,n:'蜷亥罰蟋泌藤莨・},{l:'菴楢ご蟋泌藤莨・,n:'菴楢ご蟋泌藤莨・},
{l:'菫晏▼蟋泌藤莨・,n:'菫晏▼蟋泌藤莨・},{l:'謾ｾ騾∝ｧ泌藤莨・,n:'謾ｾ騾∝ｧ泌藤莨・}
];
const ALL_NAMES=CATS.filter(c=>!c.g).map(c=>c.n);
function visibleCats(){return CATS.filter(c=>!c.g&&(!c.roles||(curUser&&c.roles.some(r=>userRolesArr.includes(r))))).map(c=>c.n)}
let curCat='荳贋ｸｭ騾｣邨｡',curUser=null,allPosts=[],searchQuery='';
const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const REACT_ICONS={like:'総',heart:'笶､・・,ok:'笨・,question:'笶・,thanks:'剌'};

let counts={},collapsedGroups={'驛ｨ豢ｻ蜍・:true,'蟋泌藤莨・:true};
function tabs(){
  const c=$('bTabs');c.innerHTML='';const q=searchQuery.trim().toLowerCase();let inGroup=false,groupCollapsed=false,groupName='';
  CATS.forEach(t=>{
    if(t.roles&&(!curUser||!t.roles.some(r=>userRolesArr.includes(r))))return;
    if(q&&!t.g&&!t.n.toLowerCase().includes(q))return;
    const b=document.createElement('button');b.className='tab';
    if(t.g){
      inGroup=true;const gName=t.l.replace(/^窶能s*|\s*窶・/g,'');groupName=gName;groupCollapsed=collapsedGroups[gName];
      b.classList.add('separator');b.style.cursor='pointer';
      b.textContent=(groupCollapsed?'笆ｶ ':'笆ｼ ')+t.l;
      b.addEventListener('click',()=>{collapsedGroups[gName]=!collapsedGroups[gName];tabs()});
    }else{
      if(!q&&inGroup&&groupCollapsed){b.style.display='none'}
      if(t.n===curCat)b.classList.add('active');
      b.addEventListener('click',()=>{curCat=t.n;tabs();sel();load()});
      if(counts[t.n]){const dot=document.createElement('span');dot.className='tab-dot';dot.textContent=counts[t.n];b.appendChild(dot)}
    }
    if(!t.g)b.textContent=t.l;c.appendChild(b);
  });
}

async function loadCounts(){try{counts=await api('/api/posts/counts')}catch(e){}}

function sel(){
  const s=$('bCat');if(!s)return;s.innerHTML='';
  const cats=visibleCats();
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;if(c===curCat)o.selected=true;s.appendChild(o)})
}

async function load(){
  const c=$('bList');c.innerHTML='<div class="empty-state">隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ...</div>';
  try{
    const p=await api('/api/posts?category='+encodeURIComponent(curCat));
    allPosts=p||[];renderPosts();
  }catch(e){if(e.message.includes('隱崎ｨｼ')){sessionStorage.clear();window.location.href='02login.html'}c.innerHTML='<div class="empty-state">繧ｨ繝ｩ繝ｼ</div>'}
}
function renderPosts(){
  const c=$('bList');const q=searchQuery.trim().toLowerCase();
  const p=q?allPosts.filter(x=>x.title.toLowerCase().includes(q)||x.content.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)):allPosts;
  if(!p.length){c.innerHTML='<div class="empty-state">'+(q?'縲・+esc(searchQuery.trim())+'縲阪↓荳閾ｴ縺吶ｋ謚慕ｨｿ縺ｯ縺ゅｊ縺ｾ縺帙ｓ':'謚慕ｨｿ縺ｯ縺ｾ縺縺ゅｊ縺ｾ縺帙ｓ')+'</div>';return}
  c.innerHTML='';p.forEach(x=>render(x,c));
}
async function loadReactions(el,targetType,targetId){

function renderReactions(el,targetType,targetId,data){

// WBGT from Open-Meteo (蝓ｼ邇臥恁蜈･髢灘ｸ・
function wbgt(){
  function upd(t,h){
    const e=(h/100)*6.105*Math.exp(17.27*t/(t+237.3));const wbgt=0.567*t+0.393*e+3.94;
    const bar=$('wbgtBar'),hw=$('hWbgt');    const levels=[{max:21,lbl:'豕ｨ諢・,adv:'驕ｩ蠎ｦ縺ｫ豌ｴ蛻・｣懃ｵｦ',cls:'l0',hcls:'hw0'},{max:25,lbl:'隴ｦ謌・,adv:'遨肴･ｵ逧・↓豌ｴ蛻・｣懃ｵｦ',cls:'l1',hcls:'hw1'},{max:28,lbl:'蜴ｳ驥崎ｭｦ謌・,adv:'遨肴･ｵ逧・↓莨第・',cls:'l2',hcls:'hw2'},{max:31,lbl:'蜊ｱ髯ｺ',adv:'豼縺励＞驕句虚縺ｯ荳ｭ豁｢',cls:'l3',hcls:'hw3'},{max:99,lbl:'讌ｵ蠎ｦ蜊ｱ髯ｺ',adv:'驕句虚縺ｯ蜴溷援荳ｭ豁｢',cls:'l4',hcls:'hw4'}];
    const lv=levels.find(l=>wbgt<l.max)||levels[levels.length-1];
    bar.className='wbgt-'+lv.cls;bar.innerHTML='<div class="wbgt-val">'+wbgt.toFixed(1)+'</div><div><div class="wbgt-label">蝓ｼ邇臥恁蜈･髢灘ｸ・WBGT '+lv.lbl+'</div><div class="wbgt-advice">'+lv.adv+'</div></div><div class="wbgt-detail"><span>'+t+'ﾂｰC</span><span>'+h+'%</span></div>';
    hw.style.display='inline-flex';hw.className='hwbgt '+lv.hcls;hw.textContent='蝓ｼ邇臥恁蜈･髢灘ｸ・WBGT '+wbgt.toFixed(1)+'ﾂｰC '+lv.lbl;
  }
  const lat=35.84,lon=139.39; // 蝓ｼ邇臥恁蜈･髢灘ｸ・  function w(){fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FTokyo').then(r=>r.json()).then(d=>{if(d.current)upd(d.current.temperature_2m,d.current.relative_humidity_2m)}).catch(()=>{})}
  w();setInterval(w,300000);
}

const WARN_JP={'02':'螟ｧ髮ｨ','03':'豢ｪ豌ｴ','04':'證ｴ鬚ｨ','05':'證ｴ鬚ｨ髮ｪ','06':'螟ｧ髮ｪ','07':'豕｢豬ｪ','08':'鬮俶ｽｮ','10':'螟ｧ髮ｨ豕ｨ諢丞ｱ','12':'螟ｧ髮ｪ豕ｨ諢丞ｱ','14':'證ｴ鬚ｨ髮ｪ豕ｨ諢丞ｱ','15':'豕｢豬ｪ豕ｨ諢丞ｱ','16':'鬮俶ｽｮ豕ｨ諢丞ｱ','18':'豢ｪ豌ｴ豕ｨ諢丞ｱ','20':'髮ｷ豕ｨ諢丞ｱ','21':'陞埼妛豕ｨ諢丞ｱ','22':'豼・悸豕ｨ諢丞ｱ','23':'荵ｾ辯･豕ｨ諢丞ｱ','24':'縺ｪ縺繧梧ｳｨ諢丞ｱ','25':'菴取ｸｩ豕ｨ諢丞ｱ','26':'髴懈ｳｨ諢丞ｱ','27':'逹豌ｷ豕ｨ諢丞ｱ','28':'逹髮ｪ豕ｨ諢丞ｱ','29':'鬮俶ｸｩ豕ｨ諢丞ｱ'};

async function fetchJMASaitama(){
  try{
    const warn=await fetch('https://www.jma.go.jp/bosai/warning/data/warning/110000.json').then(r=>r.json());
    if(!warn?.timeSeries?.length){return null}
    const list=[];
    (warn.timeSeries[0]?.areas||[]).forEach(a=>{(a.warnings||[]).forEach(w=>{const wl=WARN_JP[w.code]||w.code;if(!list.includes(wl)&&w.status==='逋ｺ陦ｨ')list.push(wl)})});
    (warn.timeSeries[0]?.areas||[]).forEach(a=>{(a.forecasts||[]).forEach(f=>{(f.warnings||[]).forEach(w=>{const wl=WARN_JP[w.code]||w.code;if(!list.includes(wl))list.push(wl)})})});
    if(!list.length){return null}
    return '笞・・蝓ｼ邇臥恁蜈･髢灘ｸゅ↓'+list.slice(0,4).join('繝ｻ')+'隴ｦ蝣ｱ逋ｺ陦ｨ';
  }catch(e){return null}
}
