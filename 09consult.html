<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>逶ｸ隲・ｮｱ - 荳願陸豐｢荳ｭ蟄ｦ譬｡</title>
<style>
:root{--primary:#3a6b5c;--primary-dark:#2d5548;--primary-light:#5a8a7a;--accent:#e07a5f;--bg:#f7f4f0;--card:#fff;--text:#2c2c2c;--sub:#8a8682;--border:#e8e2d8;--danger:#c96565;--radius:12px;--shadow:0 2px 12px rgba(58,107,92,0.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-light));padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header-title{font-size:17px;font-weight:700;color:#fff}
.header-right{display:flex;align-items:center;gap:10px}
.header-link{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:4px 14px;font-size:12px;cursor:pointer;color:rgba(255,255,255,.85);border-radius:8px;text-decoration:none;transition:all .2s}
.header-link:hover{background:rgba(255,255,255,.25);color:#fff}
.main-content{max-width:700px;margin:0 auto;padding:20px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text)}
.card p{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.5}
textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#faf8f5;transition:all .25s;min-height:120px;resize:vertical}
textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(58,107,92,0.1)}
select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#faf8f5;margin-bottom:12px;cursor:pointer}
select:focus{outline:none;border-color:var(--primary);background:#fff}
.btn{padding:10px 24px;font-size:14px;font-weight:700;border:none;border-radius:8px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(58,107,92,0.25)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b55a5a}
.btn-outline{background:0 0;border:1.5px solid var(--border);color:var(--sub)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}
.msg-list{display:flex;flex-direction:column;gap:8px}
.msg-item{display:flex;gap:12px;padding:12px 16px;background:#faf8f5;border-radius:8px;align-items:flex-start}
.msg-body{flex:1}
.msg-text{font-size:14px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
.msg-flag{font-size:11px;color:var(--danger);font-weight:700;margin-top:2px}
.msg-to{font-size:11px;color:var(--primary);font-weight:600;margin-top:2px}
.msg-time{font-size:11px;color:var(--sub);margin-top:4px}
.msg-user{font-size:11px;color:var(--accent);font-weight:600;margin-top:2px}
.empty-state{text-align:center;padding:40px 20px;color:#c5c0b8;font-size:14px}
.success-msg{display:none;text-align:center;padding:20px;background:#eaf3e8;color:#2d6b4a;border-radius:8px;font-size:14px;font-weight:700;margin-bottom:16px}
.success-msg.show{display:block}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.toggle-row{display:flex;gap:10px;margin-bottom:12px}
.toggle-btn{flex:1;padding:8px;font-size:13px;font-weight:600;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;background:#faf8f5;color:var(--sub);transition:all .2s;text-align:center;font-family:inherit}
.toggle-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:28px 24px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-box h3{font-size:15px;font-weight:700;color:var(--danger);margin-bottom:12px}
.modal-box p{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:16px;white-space:pre-wrap}
.modal-box .modal-actions{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<header class="header">
  <div class="header-title">逶ｸ隲・ｮｱ</div>
  <div class="header-right">
    <span id="hUser" style="font-size:12px;color:rgba(255,255,255,.75)"></span>
    <a href="/" class="header-link">鮟呈攸</a>
  </div>
</header>
<main class="main-content">
  <div class="card" id="mainCard">
    <h2>陶 蜈育函縺ｫ逶ｸ隲・☆繧・/h2>
    <p>謨咏ｧ代・雉ｪ蝠上〒繧ゆｽ輔〒繧よｰ苓ｻｽ縺ｫ縺ｩ縺・◇縲・br>蛹ｿ蜷阪〒繧ょ錐荵励▲縺ｦ騾√ｋ縺薙→繧ゅ〒縺阪∪縺吶・/p>
    <div class="form-group">
      <label>騾∽ｿ｡蜈医・蜈育函</label>
      <select id="cTo"><option value="all">蜈ｨ謨吝藤</option></select>
    </div>
    <div class="toggle-row">
      <button class="toggle-btn active" id="anonBtn">蛹ｿ蜷阪〒騾√ｋ</button>
      <button class="toggle-btn" id="namedBtn">蜷榊燕繧貞錐荵励ｋ</button>
    </div>
    <textarea id="cMsg" placeholder="逶ｸ隲・・螳ｹ繧呈嶌縺・※縺上□縺輔＞窶ｦ"></textarea>
    <button class="btn btn-primary" id="cSendBtn">騾∽ｿ｡縺吶ｋ</button>
    <div class="success-msg" id="cSuccess">騾∽ｿ｡縺励∪縺励◆ 笨会ｸ・/div>
  </div>
  <div class="card" id="adminSection" style="display:none">
    <h2>搭 逶ｸ隲・ｸ隕ｧ</h2>
    <div class="msg-list" id="msgList"><div class="empty-state">隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ...</div></div>
  </div>
</main>

<div class="modal-overlay" id="warnModal">
  <div class="modal-box">
    <h3>笞・・隴ｦ蜻・/h3>
    <p id="warnText"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" id="warnCancel">繧ｭ繝｣繝ｳ繧ｻ繝ｫ</button>
      <button class="btn btn-danger" id="warnConfirm">邏榊ｾ励＞縺九↑縺・/button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="banModal">
  <div class="modal-box">
    <h3>圻 蛻ｩ逕ｨ蛛懈ｭ｢</h3>
    <p id="banText"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="document.getElementById('banModal').classList.remove('show')">髢峨§繧・/button>
    </div>
  </div>
</div>

<script>
const API_BASE=''
async function a(p,o={}){const t=sessionStorage.getItem('token'),h={'Content-Type':'application/json',...o.headers};if(t)h['Authorization']='Bearer '+t;const r=await fetch(API_BASE+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw new Error(d.error||'繧ｨ繝ｩ繝ｼ');return d}
const A={requireAuth(){const u=sessionStorage.getItem('username'),r=sessionStorage.getItem('role'),t=sessionStorage.getItem('token');if(!u||!r||!t)return null;return{username:u,role:r,token:t}}};window.AUTH=A
const $=id=>document.getElementById(id),esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const u=AUTH.requireAuth();if(!u)window.location.href='02login.html'
$('hUser').textContent=u.username
const isTeacher=u.role==='admin'||u.role==='subadmin'
if(isTeacher)$('adminSection').style.display='block'

let anon=true,teacherMap={},pendingMsg='',pendingAnon=true,pendingTo='all'

// 蛹ｿ蜷・蜷堺ｹ励ｋ繝医げ繝ｫ
$('anonBtn').addEventListener('click',()=>{anon=true;$('anonBtn').classList.add('active');$('namedBtn').classList.remove('active')})
$('namedBtn').addEventListener('click',()=>{anon=false;$('namedBtn').classList.add('active');$('anonBtn').classList.remove('active')})

// 蜈育函荳隕ｧ蜿門ｾ・(async function(){
  try{
    const teachers=await a('/api/consult/teachers');
    const sel=$('cTo');sel.innerHTML='<option value="all">蜈ｨ謨吝藤</option>';
    teachers.forEach(t=>{teacherMap[t.username]=t.display_name;const o=document.createElement('option');o.value=t.username;o.textContent=t.display_name;sel.appendChild(o)})
  }catch(e){}
})();

// 蛻ｩ逕ｨ蛛懈ｭ｢繝√ぉ繝・け
(async function(){
  try{
    const s=await a('/api/consult/status');
    if(s.banned){
      $('mainCard').innerHTML='<h2>圻 蛻ｩ逕ｨ蛛懈ｭ｢荳ｭ</h2><p>荳埼←蛻・↑蛻ｩ逕ｨ縺後≠縺｣縺溘◆繧√∝諺蜷咲嶌隲・園縺ｯ縺ゅ→ <strong>'+s.days_remaining+'譌･</strong> 縺泌茜逕ｨ縺・◆縺縺代∪縺帙ｓ縲・/p>';
    }
  }catch(e){}
})();

$('cSendBtn').addEventListener('click',async()=>{
  const msg=$('cMsg').value.trim();
  if(!msg){alert('蜀・ｮｹ繧貞・蜉帙＠縺ｦ縺上□縺輔＞');return}
  const to=$('cTo').value
  $('cSendBtn').disabled=true;$('cSendBtn').textContent='騾∽ｿ｡荳ｭ...';
  try{
    const r=await a('/api/consult',{method:'POST',body:JSON.stringify({message:msg,to,anonymous:anon})});
    if(r.status==='warning'){
      pendingMsg=msg;pendingAnon=anon;pendingTo=to;
      $('warnText').textContent=r.message;
      $('warnModal').classList.add('show');
    }else if(r.status==='blocked'){
      $('banText').textContent='荳埼←蛻・↑謚慕ｨｿ縺檎｢ｺ隱阪＆繧後◆縺溘ａ縲∝諺蜷咲嶌隲・園繧・繝ｶ譛亥茜逕ｨ蛛懈ｭ｢縺ｫ縺励∪縺励◆縲・n\n莉雁屓縺ｮ繝｡繝・そ繝ｼ繧ｸ縺ｯ蜈育函縺ｫ蜷榊燕莉倥″縺ｧ螻翫＞縺ｦ縺・∪縺吶・;
      $('banModal').classList.add('show');$('cMsg').value='';
    }else if(r.status==='ok'){
      $('cMsg').value='';$('cSuccess').classList.add('show');setTimeout(()=>$('cSuccess').classList.remove('show'),3000);
    }else if(r.status==='banned'){
      $('banText').textContent='蛻ｩ逕ｨ蛛懈ｭ｢荳ｭ縺ｧ縺吶りｧ｣髯､縺ｾ縺ｧ縺ゅ→ '+r.days_remaining+' 譌･縺ｧ縺吶・;
      $('banModal').classList.add('show');
    }
  }catch(e){alert(e.message)}
  $('cSendBtn').disabled=false;$('cSendBtn').textContent='騾∽ｿ｡縺吶ｋ';
});

$('warnCancel').addEventListener('click',()=>{$('warnModal').classList.remove('show');pendingMsg=''});
$('warnConfirm').addEventListener('click',async()=>{
  $('warnModal').classList.remove('show');
  if(!pendingMsg)return;
  $('cSendBtn').disabled=true;$('cSendBtn').textContent='騾∽ｿ｡荳ｭ...';
  try{
    await a('/api/consult/confirm',{method:'POST',body:JSON.stringify({message:pendingMsg,to:pendingTo,anonymous:pendingAnon})});
    $('cMsg').value='';$('cSuccess').classList.add('show');setTimeout(()=>$('cSuccess').classList.remove('show'),3000);
  }catch(e){alert(e.message)}
  $('cSendBtn').disabled=false;$('cSendBtn').textContent='騾∽ｿ｡縺吶ｋ';pendingMsg='';
});

async function loadMsgs(){
  if(!isTeacher)return;
  try{
    const data=await a('/api/consult');
    const el=$('msgList');
    if(!data.length){el.innerHTML='<div class="empty-state">逶ｸ隲・・縺ｾ縺縺ゅｊ縺ｾ縺帙ｓ</div>';return}
    el.innerHTML=data.slice().reverse().map(m=>{
      const d=new Date(m.created_at);const ds=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      const flag=m.flagged?'<div class="msg-flag">笞 螳溷錐蝣ｱ蜻・/div>':'';
      const fromName=m.username?'<div class="msg-user">from: '+esc(m.username)+'</div>':'<div class="msg-user" style="color:var(--sub)">蛹ｿ蜷・/div>';
      const toLabel=m.to&&m.to!=='all'&&teacherMap[m.to]?' 竊・'+teacherMap[m.to]:'';
      const toTag=m.to?('<div class="msg-to">騾∽ｿ｡蜈・ '+(m.to==='all'?'蜈ｨ謨吝藤':(teacherMap[m.to]||m.to))+toLabel+'</div>'):'';
      return '<div class="msg-item"><div class="msg-body">'+fromName+toTag+'<div class="msg-text">'+esc(m.message)+'</div>'+flag+'<div class="msg-time">'+ds+'</div></div><button class="btn btn-danger btn-sm" data-id="'+m.id+'">蜑企勁</button></div>';
    }).join('');
    el.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',async function(){if(!confirm('蜑企勁縺励∪縺吶°・・))return;try{await a('/api/consult/'+this.dataset.id,{method:'DELETE'});loadMsgs()}catch(e){alert(e.message)}}));
  }catch(e){$('msgList').innerHTML='<div class="empty-state">繧ｨ繝ｩ繝ｼ</div>'}
}
loadMsgs();
</script>
</body>
</html>
