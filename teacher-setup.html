<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>先生の初期設定 - 上藤沢中学校</title>
<style>
:root{--primary:#1E4D2B;--primary-dark:#153820;--bg:#f7f5f0;--card:#fff;--text:#2c2c2c;--sub:#8a8682;--border:#e0dcd4;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
.card{background:var(--card);border-radius:var(--radius);padding:30px 24px;max-width:420px;width:100%;box-shadow:0 2px 12px rgba(30,77,43,0.06)}
h1{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.desc{font-size:13px;color:var(--sub);margin-bottom:20px;line-height:1.6}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.form-group select,.form-group input{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#faf8f5}
.form-group select:focus,.form-group input:focus{outline:none;border-color:var(--primary);background:#fff}
.form-group .hint{font-size:11px;color:var(--sub);margin-top:3px}
.btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.step-indicator{display:flex;gap:6px;margin-bottom:20px;justify-content:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.step-dot.active{background:var(--primary);width:24px;border-radius:4px}
.step-dot.done{background:var(--primary);opacity:.4}
.step{display:none}
.step.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.step.active{animation:fadeIn .3s}
</style>
</head>
<body>
<div class="card">
<h1>👨‍🏫 先生の初期設定</h1>
<p class="desc">はじめまして！学校黒板を使うための基本情報を教えてください</p>
<div class="step-indicator" id="stepDots"><div class="step-dot active"></div><div class="step-dot"></div><div class="step-dot"></div></div>

<div class="step active" id="step1">
<div class="form-group"><label>担当学年</label><select id="tGrade"><option value="">選択してください</option><option value="1">1学年</option><option value="2">2学年</option><option value="3">3学年</option><option value="other">その他（複数学年・全校など）</option></select></div>
<button class="btn" id="step1Btn" disabled>次へ</button>
</div>

<div class="step" id="step2">
<div class="form-group"><label>担当教科</label><input type="text" id="tSubject" placeholder="例：数学、英語、理科..." maxlength="50"></div>
<button class="btn" id="step2Btn">次へ</button>
</div>

<div class="step" id="step3">
<div class="form-group"><label>担任を持っていますか？</label><select id="tHomeroom"><option value="">選択してください</option><option value="no">いいえ</option><option value="yes">はい</option></select></div>
<div class="form-group" id="tHomeroomGroup" style="display:none"><label>何組？</label><input type="number" id="tHomeroomClass" min="1" max="10" placeholder="組番号"></div>
<button class="btn" id="step3Btn">保存して始める</button>
</div>
</div>

<script>
const API_BASE=''
async function a(p,o={}){const t=sessionStorage.getItem('token'),h={'Content-Type':'application/json',...o.headers};if(t)h['Authorization']='Bearer '+t;const r=await fetch(API_BASE+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw new Error(d.error||'エラー');return d}
const $=id=>document.getElementById(id),cu=sessionStorage.getItem('username'),role=sessionStorage.getItem('role');
if(!cu||!sessionStorage.getItem('token'))window.location.href='02login.html';
const roles=(role||'').split(',').map(r=>r.trim());
if(!roles.includes('teacher')&&!roles.includes('admin'))window.location.href='01index.html';

let step=1;
function showStep(n){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));$('step'+n).classList.add('active');document.querySelectorAll('.step-dot').forEach((d,i)=>{d.classList.toggle('active',i===n-1);d.classList.toggle('done',i<n-1)});step=n}

$('tGrade').addEventListener('change',()=>{$('step1Btn').disabled=!$('tGrade').value});
$('step1Btn').addEventListener('click',()=>showStep(2));
$('step2Btn').addEventListener('click',()=>showStep(3));
$('tHomeroom').addEventListener('change',()=>{$('tHomeroomGroup').style.display=$('tHomeroom').value==='yes'?'block':'none'});
$('step3Btn').addEventListener('click',async()=>{
  const grade=$('tGrade').value,subject=$('tSubject').value.trim(),homeroom=$('tHomeroom').value,hrClass=$('tHomeroomClass').value.trim();
  if(!grade||!subject){alert('入力してください');return}
  $('step3Btn').disabled=true;$('step3Btn').textContent='保存中...';
  try{
    await a('/api/me',{method:'PUT',body:JSON.stringify({teacher_grade:grade,teacher_subject:subject,teacher_homeroom:homeroom==='yes'?hrClass:'',teacher_setup_done:true})});
    window.location.href='01index.html';
  }catch(e){alert('エラー: '+e.message)}
  $('step3Btn').disabled=false;$('step3Btn').textContent='保存して始める';
});
</script>
</body>
</html>
