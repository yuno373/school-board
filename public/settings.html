<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>繝ｦ繝ｼ繧ｶ繝ｼ險ｭ螳・- 荳願陸豐｢荳ｭ蟄ｦ譬｡</title>
<style>
:root{--primary:#1E4D2B;--primary-dark:#153820;--primary-light:#2D6B40;--bg:#f7f5f0;--card:#fff;--text:#2c2c2c;--sub:#8a8682;--border:#e0dcd4;--radius:12px;--shadow:0 2px 12px rgba(30,77,43,0.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--primary);padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.header-title{font-size:16px;font-weight:700;color:#fff}
.header-right{display:flex;gap:8px}
.header-link{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);padding:4px 12px;font-size:12px;cursor:pointer;color:rgba(255,255,255,.85);border-radius:8px;text-decoration:none;font-family:inherit}
.header-link:hover{background:rgba(255,255,255,.25);color:#fff}
.main{max-width:500px;margin:0 auto;padding:20px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#faf8f5;transition:all .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(30,77,43,0.08)}
.btn{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn:hover{background:#153820;box-shadow:0 4px 12px rgba(30,77,43,0.2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:0 0;border:2px solid var(--border);color:var(--sub)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);box-shadow:none}
.success{color:#2d6b4a;font-size:13px;margin-top:6px}
.error{color:var(--danger);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<header class="header">
  <div class="header-title">笞呻ｸ・繝ｦ繝ｼ繧ｶ繝ｼ險ｭ螳・/div>
  <div class="header-right">
    <a href="01index.html" class="header-link">鮟呈攸縺ｫ謌ｻ繧・/a>
  </div>
</header>
<div class="main">
  <div class="card">
    <h2>繝励Ο繝輔ぅ繝ｼ繝ｫ</h2>
    <div class="form-group"><label>陦ｨ遉ｺ蜷・/label><input type="text" id="sDispName" placeholder="陦ｨ遉ｺ蜷・></div>
    <div class="form-group"><label>驛ｨ豢ｻ蜍・/label><select id="sClub"><option value="">窶・/option></select></div>
    <div class="form-group"><label>蟋泌藤莨・/label><select id="sCommittee"><option value="">窶・/option></select></div>
    <button class="btn" id="saveProfile">菫晏ｭ・/button>
    <div id="profileStatus"></div>
  </div>
  <div class="card">
    <h2>繝代せ繝ｯ繝ｼ繝牙､画峩</h2>
    <div class="form-group"><label>迴ｾ蝨ｨ縺ｮ繝代せ繝ｯ繝ｼ繝・/label><input type="password" id="sCurPw"></div>
    <div class="form-group"><label>譁ｰ縺励＞繝代せ繝ｯ繝ｼ繝・/label><input type="password" id="sNewPw"></div>
    <div class="form-group"><label>譁ｰ縺励＞繝代せ繝ｯ繝ｼ繝会ｼ育｢ｺ隱搾ｼ・/label><input type="password" id="sNewPw2"></div>
    <button class="btn" id="changePwBtn">螟画峩</button>
    <div id="pwStatus"></div>
  </div>
</div>
<script>
const API_BASE=''
async function a(p,o={}){const t=sessionStorage.getItem('token'),h={'Content-Type':'application/json',...o.headers};if(t)h['Authorization']='Bearer '+t;const r=await fetch(API_BASE+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw new Error(d.error||'繧ｨ繝ｩ繝ｼ');return d}
const $=id=>document.getElementById(id);
if(!sessionStorage.getItem('token'))window.location.href='02login.html';
const CLUBS=['蜷ｹ螂乗･ｽ驛ｨ','闌ｶ驕馴Κ','鄒手｡馴Κ','蜊鍋帥驛ｨ','繝・ル繧ｹ驛ｨ螂ｳ蟄・,'繝・ル繧ｹ驛ｨ逕ｷ蟄・,'繧ｵ繝・き繝ｼ驛ｨ','驥守帥驛ｨ','髯ｸ荳企Κ','繝舌せ繧ｱ驛ｨ螂ｳ蟄・,'繝舌せ繧ｱ驛ｨ逕ｷ蟄・,'繝舌Ξ繝ｼ驛ｨ'];
const COMMS=['謨ｴ蛯吝ｧ泌藤莨・,'逕滓ｴｻ蟋泌藤莨・,'驕ｸ謖咏ｮ｡逅・ｧ泌藤莨・,'蝗ｳ譖ｸ蟋泌藤莨・,'邨ｦ鬟溷ｧ泌藤莨・,'蜷亥罰蟋泌藤莨・,'菴楢ご蟋泌藤莨・,'菫晏▼蟋泌藤莨・,'謾ｾ騾∝ｧ泌藤莨・];
CLUBS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('sClub').appendChild(o)});
COMMS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('sCommittee').appendChild(o)});

async function loadProfile(){try{const u=await a('/api/me');$('sDispName').value=u.display_name||'';if(u.club)$('sClub').value=u.club;if(u.committee)$('sCommittee').value=u.committee}catch(e){}}
loadProfile();

$('saveProfile').addEventListener('click',async()=>{
  const dn=$('sDispName').value.trim(),club=$('sClub').value,comm=$('sCommittee').value;
  try{await a('/api/me',{method:'PUT',body:JSON.stringify({display_name:dn,club,committee:comm})});$('profileStatus').textContent='笨・菫晏ｭ倥＠縺ｾ縺励◆';$('profileStatus').className='success'}catch(e){$('profileStatus').textContent='笶・'+e.message;$('profileStatus').className='error'}
});
$('changePwBtn').addEventListener('click',async()=>{
  const cur=$('sCurPw').value,pw=$('sNewPw').value,pw2=$('sNewPw2').value;
  if(!cur||!pw){$('pwStatus').textContent='蜈･蜉帙＠縺ｦ縺上□縺輔＞';$('pwStatus').className='error';return}
  if(pw.length<6){$('pwStatus').textContent='6譁・ｭ嶺ｻ･荳雁ｿ・ｦ√〒縺・;$('pwStatus').className='error';return}
  if(pw!==pw2){$('pwStatus').textContent='繝代せ繝ｯ繝ｼ繝峨′荳閾ｴ縺励∪縺帙ｓ';$('pwStatus').className='error';return}
  try{await a('/api/me/password',{method:'POST',body:JSON.stringify({currentPassword:cur,newPassword:pw})});$('pwStatus').textContent='笨・螟画峩縺励∪縺励◆';$('pwStatus').className='success';$('sCurPw').value='';$('sNewPw').value='';$('sNewPw2').value=''}catch(e){$('pwStatus').textContent='笶・'+e.message;$('pwStatus').className='error'}
});
</script>
</body>
</html>
